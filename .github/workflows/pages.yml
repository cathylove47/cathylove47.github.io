name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: .
      - name: Wait for uploaded Pages artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The upload step did not return a Pages artifact ID."
            exit 1
          fi
          for attempt in {1..12}; do
            if ready=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq ".artifacts[] | select(.id == $ARTIFACT_ID and .expired == false) | .id") \
              && [[ "$ready" == "$ARTIFACT_ID" ]]; then
              echo "Pages artifact $ARTIFACT_ID is visible on attempt $attempt."
              exit 0
            fi
            if (( attempt < 12 )); then sleep 5; fi
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not become visible after 12 checks."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
