<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" role="img" aria-labelledby="t"><title id="t">2010 指令格式与机器码</title><rect width="620" height="430" rx="10" fill="#fff"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#17232e"><text x="20" y="30" font-size="17" fill="#17232e" text-anchor="start" font-weight="normal">2010 组成原理 43：单字长指令格式与 add (R4),(R5)+ 的机器码</text><rect x="20" y="60" width="90" height="42" fill="#f2f7fb" stroke="#356c91"/><text x="65.0" y="77" font-size="13" fill="#356c91" text-anchor="middle" font-weight="normal">OP</text><text x="65.0" y="94" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">0010</text><rect x="110" y="60" width="70" height="42" fill="#f2f7fb" stroke="#356c91"/><text x="145.0" y="77" font-size="13" fill="#356c91" text-anchor="middle" font-weight="normal">Ms</text><text x="145.0" y="94" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">001</text><rect x="180" y="60" width="70" height="42" fill="#f2f7fb" stroke="#356c91"/><text x="215.0" y="77" font-size="13" fill="#356c91" text-anchor="middle" font-weight="normal">Rs</text><text x="215.0" y="94" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">100</text><rect x="250" y="60" width="70" height="42" fill="#f2f7fb" stroke="#356c91"/><text x="285.0" y="77" font-size="13" fill="#356c91" text-anchor="middle" font-weight="normal">Md</text><text x="285.0" y="94" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">010</text><rect x="320" y="60" width="70" height="42" fill="#f2f7fb" stroke="#356c91"/><text x="355.0" y="77" font-size="13" fill="#356c91" text-anchor="middle" font-weight="normal">Rd</text><text x="355.0" y="94" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">101</text><text x="20" y="130" font-size="14" fill="#526575" text-anchor="start" font-weight="normal">位序 15 ... 12 | 11 ... 9 | 8 ... 6 | 5 ... 3 | 2 ... 0</text><text x="20" y="160" font-size="14" fill="#17232e" text-anchor="start" font-weight="normal">Ms=001 寄存器间接 (R4)：源操作数 = ((R4))</text><text x="20" y="184" font-size="14" fill="#17232e" text-anchor="start" font-weight="normal">Md=010 寄存器间接自增 (R5)+：先取 ((R5))，再 (R5)+1 → R5</text><text x="20" y="216" font-size="17" fill="#b42318" text-anchor="start" font-weight="bold">拼接：0010 0011 0001 0101 B = 2315 H</text><text x="20" y="258" font-size="15" fill="#356c91" text-anchor="start" font-weight="normal">执行：((R4)) + ((R5)) → (R5)，然后 R5 自增</text><rect x="20" y="272" width="150" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="95.0" y="297.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">(R4)=1234H</text><rect x="190" y="272" width="150" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="265.0" y="297.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">(1234H)=5678H</text><rect x="20" y="330" width="150" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="95.0" y="355.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">(R5)=5678H</text><rect x="190" y="330" width="150" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="265.0" y="355.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">(5678H)=1234H</text><rect x="380" y="300" width="170" height="44" rx="6" fill="#fdeeea" stroke="#b42318" stroke-width="1.4"/><text x="465.0" y="327.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">5678H+1234H=68ACH</text><text x="20" y="404" font-size="15" fill="#b42318" text-anchor="start" font-weight="normal">结果写入 5678H；R5 变为 5679H</text></g></svg>