<svg xmlns="http://www.w3.org/2000/svg" width="560" height="392" viewBox="0 0 560 392" role="img" aria-labelledby="t"><title id="t">2017 代码长度与 CF</title><rect width="560" height="392" rx="10" fill="#fff"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#17232e"><text x="20" y="30" font-size="17" fill="#17232e" text-anchor="start" font-weight="normal">2017 组成原理 44：机器级代码长度与标志位</text><rect x="30" y="60" width="150" height="44" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="105.0" y="87.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">push ebp  00401020H</text><rect x="30" y="130" width="190" height="44" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="125.0" y="157.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">cmp [ebp-0Ch],ecx  0040105EH</text><rect x="30" y="200" width="150" height="44" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="105.0" y="227.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">shl edx,1  00401066H</text><rect x="30" y="270" width="150" height="44" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="105.0" y="297.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">ret  0040107FH</text><path d="M210,82 L300,82 L300,292 L190,292" fill="none" stroke="#356c91" stroke-dasharray="5 4"/><text x="310" y="120" font-size="14" fill="#17232e" text-anchor="start" font-weight="normal">首地址 00401020H</text><text x="310" y="146" font-size="14" fill="#17232e" text-anchor="start" font-weight="normal">末地址 0040107FH</text><text x="310" y="180" font-size="14" fill="#17232e" text-anchor="start" font-weight="normal">长度 = 107FH−1020H+1</text><text x="310" y="204" font-size="16" fill="#b42318" text-anchor="start" font-weight="bold">= 60H = 96 B</text><text x="310" y="246" font-size="14" fill="#17232e" text-anchor="start" font-weight="normal">指令长度 1、2、3 字节不等 ⇒ CISC</text><text x="20" y="340" font-size="15" fill="#356c91" text-anchor="start" font-weight="normal">f1(0)：i=0，n−1=FFFFFFFFH</text><text x="20" y="366" font-size="15" fill="#b42318" text-anchor="start" font-weight="normal">0 − FFFFFFFFH 即 0 + 00000001H：C=0 ⇒ CF=C⊕1=1</text></g></svg>