<svg xmlns="http://www.w3.org/2000/svg" width="520" height="310" viewBox="0 0 520 310" role="img" aria-labelledby="t"><title id="t">2019 call 偏移</title><rect width="520" height="310" rx="10" fill="#fff"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#17232e"><text x="20" y="30" font-size="17" fill="#17232e" text-anchor="start" font-weight="normal">2019 组成原理 45：call 的相对偏移与小端存放</text><rect x="30" y="60" width="190" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="125.0" y="85.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">call 指令 00401025H（5 字节）</text><rect x="30" y="120" width="190" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="125.0" y="145.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">下一条 0040102AH</text><rect x="300" y="60" width="190" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="395.0" y="85.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">目标 00401000H</text><path d="M220,80 L300,80" stroke="#b42318" stroke-width="2" marker-end="url(#a)"/><text x="30" y="190" font-size="15" fill="#17232e" text-anchor="start" font-weight="normal">偏移 = 目标 − 下一条 = 00401000H − 0040102AH = FFFFFFD6H</text><text x="30" y="222" font-size="15" fill="#b42318" text-anchor="start" font-weight="normal">机器码中偏移字节：D6 FF FF FF ⇒ 低字节在前 ⇒ 小端</text><text x="30" y="262" font-size="15" fill="#526575" text-anchor="start" font-weight="normal">调用 f(10) 共 10 次；f(13) 溢出为 1932053504</text><text x="30" y="288" font-size="15" fill="#526575" text-anchor="start" font-weight="normal">13! = 6227020800 &gt; 2^31−1 ⇒ 改用 64 位或 double</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b42318"/></marker></defs></g></svg>