<svg xmlns="http://www.w3.org/2000/svg" width="540" height="308" viewBox="0 0 540 308" role="img" aria-labelledby="t"><title id="t">2023 相对转移与大小端</title><rect width="540" height="308" rx="10" fill="#fff"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#17232e"><text x="20" y="30" font-size="17" fill="#17232e" text-anchor="start" font-weight="normal">2023 组成原理 44：相对转移、立即数与大小端</text><rect x="30" y="60" width="220" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="140.0" y="85.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">jmp 00401079H  EB 09</text><rect x="30" y="120" width="220" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="140.0" y="145.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">下一条 0040107BH</text><rect x="330" y="60" width="180" height="40" rx="6" fill="#f2f7fb" stroke="#356c91" stroke-width="1.4"/><text x="420.0" y="85.0" font-size="14" fill="#17232e" text-anchor="middle" font-weight="normal">目标 00401084H</text><path d="M250,80 L330,80" stroke="#b42318" stroke-width="2"/><text x="30" y="190" font-size="15" fill="#17232e" text-anchor="start" font-weight="normal">目标 = 00401079H + 2 + 09H = 00401084H（相对寻址）</text><text x="30" y="222" font-size="15" fill="#17232e" text-anchor="start" font-weight="normal">mov [ecx+edx*4+00422000H],0Ah：源操作数为立即数</text><text x="30" y="254" font-size="15" fill="#b42318" text-anchor="start" font-weight="normal">机器码 0A 00 00 00 ⇒ 低位字节在前 ⇒ 小端</text><text x="30" y="286" font-size="15" fill="#17232e" text-anchor="start" font-weight="normal">行跨度 64×4=256 ⇒ ecx 存 i×256</text></g></svg>