<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">散列表的存储空间与待插入关键字</title>
  <desc id="dsc">下标从 0 开始的一维数组，长度 m 由装填因子和 7 个关键字共同确定；散列函数为 3 乘 key 再对 7 取模，冲突用线性探测。</desc>
  <rect width="560" height="230" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#132c40">一维数组：下标 0 开始，长度 m 待定</text>

    <g>
      <rect x="40" y="58" width="56" height="52" fill="#f4f7fa" stroke="#8a9aa8"/>
      <rect x="96" y="58" width="56" height="52" fill="#f4f7fa" stroke="#8a9aa8"/>
      <rect x="152" y="58" width="56" height="52" fill="#f4f7fa" stroke="#8a9aa8"/>
      <rect x="208" y="58" width="56" height="52" fill="#f4f7fa" stroke="#8a9aa8"/>
      <rect x="264" y="58" width="56" height="52" fill="#ffffff" stroke="#ffffff"/>
      <rect x="320" y="58" width="56" height="52" fill="#f4f7fa" stroke="#8a9aa8"/>
      <rect x="376" y="58" width="56" height="52" fill="#f4f7fa" stroke="#8a9aa8"/>
    </g>
    <g font-size="12" fill="#5b6b7a" text-anchor="middle">
      <text x="68" y="50">0</text><text x="124" y="50">1</text><text x="180" y="50">2</text>
      <text x="236" y="50">3</text><text x="348" y="50">m−2</text><text x="404" y="50">m−1</text>
      <text x="292" y="90" font-size="20" fill="#8a9aa8">…</text>
    </g>
    <g font-size="12" fill="#8a9aa8" text-anchor="middle">
      <text x="68" y="90">空</text><text x="124" y="90">空</text><text x="180" y="90">空</text>
      <text x="236" y="90">空</text><text x="348" y="90">空</text><text x="404" y="90">空</text>
    </g>

    <text x="20" y="146" font-size="13" fill="#132c40">H(key) = (3 × key) mod 7；装填因子 0.7；线性探测再散列</text>
    <text x="20" y="170" font-size="13" fill="#132c40">关键字：7、8、30、11、18、9、14（共 7 个）</text>
    <text x="20" y="196" font-size="12" fill="#5b6b7a">数组长度 m 需由“已存元素数 / m = 装填因子”推出，题面没有直接给出。</text>
    <text x="20" y="216" font-size="12" fill="#5b6b7a">线性探测：冲突时依次检查下一单元，到表尾后回到下标 0。</text>
  </g>
</svg>
