<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">有向带权图与关键路径</title>
  <desc id="dsc">顶点 0 到 5，粗红线为关键路径 0-1-2-3-5，长度 16；各顶点的 ve 与 vl 标注在结点旁。</desc>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8a9aa8"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="660" height="400" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#132c40">有向带权图 G（边旁数字为权值）</text>

    <line x1="90.7" y1="112.6" x2="189.3" y2="77.4" stroke="#c0392b" stroke-width="3.5" marker-end="url(#r)"/>
    <line x1="89.9" y1="122.2" x2="318.1" y2="147.6" stroke="#8a9aa8" stroke-width="1.8" marker-end="url(#g)"/>
    <line x1="227" y1="81.5" x2="321.3" y2="138.5" stroke="#c0392b" stroke-width="3.5" marker-end="url(#r)"/>
    <line x1="357.9" y1="141.1" x2="460.3" y2="89.8" stroke="#c0392b" stroke-width="3.5" marker-end="url(#r)"/>
    <line x1="356.8" y1="160.8" x2="461.5" y2="228.1" stroke="#8a9aa8" stroke-width="1.8" marker-end="url(#g)"/>
    <line x1="496.2" y1="91.8" x2="572.2" y2="147.1" stroke="#c0392b" stroke-width="3.5" marker-end="url(#r)"/>
    <line x1="497.8" y1="228.2" x2="572.2" y2="172.9" stroke="#8a9aa8" stroke-width="1.8" marker-end="url(#g)"/>

    <g font-size="13" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">
      <text x="128" y="86" fill="#c0392b">4</text>
      <text x="198" y="150" fill="#5b6b7a">6</text>
      <text x="288" y="104" fill="#c0392b">5</text>
      <text x="422" y="106" fill="#c0392b">4</text>
      <text x="424" y="206" fill="#5b6b7a">3</text>
      <text x="548" y="112" fill="#c0392b">3</text>
      <text x="548" y="210" fill="#5b6b7a">3</text>
    </g>

    <g>
      <circle cx="70" cy="120" r="20" fill="#eef4fa" stroke="#356c91" stroke-width="1.5"/>
      <text x="70" y="125" text-anchor="middle" font-size="15" fill="#132c40">0</text>
      <circle cx="210" cy="70" r="20" fill="#eef4fa" stroke="#356c91" stroke-width="1.5"/>
      <text x="210" y="75" text-anchor="middle" font-size="15" fill="#132c40">1</text>
      <circle cx="340" cy="150" r="20" fill="#eef4fa" stroke="#356c91" stroke-width="1.5"/>
      <text x="340" y="155" text-anchor="middle" font-size="15" fill="#132c40">2</text>
      <circle cx="480" cy="80" r="20" fill="#eef4fa" stroke="#356c91" stroke-width="1.5"/>
      <text x="480" y="85" text-anchor="middle" font-size="15" fill="#132c40">3</text>
      <circle cx="480" cy="240" r="20" fill="#eef4fa" stroke="#356c91" stroke-width="1.5"/>
      <text x="480" y="245" text-anchor="middle" font-size="15" fill="#132c40">4</text>
      <circle cx="590" cy="160" r="20" fill="#eef4fa" stroke="#356c91" stroke-width="1.5"/>
      <text x="590" y="165" text-anchor="middle" font-size="15" fill="#132c40">5</text>
    </g>

    <g font-size="11" fill="#5b6b7a" text-anchor="middle">
      <text x="70" y="92">ve0=0 vl0=0</text>
      <text x="210" y="42">ve1=4 vl1=4</text>
      <text x="340" y="188">ve2=9 vl2=9</text>
      <text x="483" y="52">ve3=13 vl3=13</text>
      <text x="483" y="280">ve4=12 vl4=13</text>
      <text x="620" y="206">ve5=16 vl5=16</text>
    </g>

    <text x="20" y="330" font-size="13" fill="#132c40">关键活动：a(0→1)、a(1→2)、a(2→3)、a(3→5)，满足 l − e = 0</text>
    <text x="20" y="356" font-size="13" fill="#1e7a4f">关键路径长度 = 4 + 5 + 4 + 3 = 16</text>
    <text x="20" y="380" font-size="12" fill="#5b6b7a">非关键活动 a(0→2)、a(2→4)、a(4→5) 的 l − e 分别为 3、1、1。</text>
  </g>
</svg>
