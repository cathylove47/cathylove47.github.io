<svg xmlns="http://www.w3.org/2000/svg" width="580" height="310" viewBox="0 0 580 310" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">六个长度不等的升序表</title>
  <desc id="dsc">A 到 F 的长度依次为 10、35、40、50、60、200，条形长度与元素个数成比例。</desc>
  <rect width="580" height="310" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#132c40">六个升序表：每次只能挑两个合并</text>

    <g font-size="14" fill="#132c40">
      <text x="28" y="67">A</text><text x="28" y="105">B</text><text x="28" y="143">C</text>
      <text x="28" y="181">D</text><text x="28" y="219">E</text><text x="28" y="257">F</text>
    </g>

    <g fill="#cfe0ee" stroke="#356c91">
      <rect x="80" y="50" width="18" height="24"/>
      <rect x="80" y="88" width="63" height="24"/>
      <rect x="80" y="126" width="72" height="24"/>
      <rect x="80" y="164" width="90" height="24"/>
      <rect x="80" y="202" width="108" height="24"/>
      <rect x="80" y="240" width="360" height="24"/>
    </g>
    <g font-size="13" fill="#132c40">
      <text x="104" y="67">10</text>
      <text x="149" y="105">35</text>
      <text x="158" y="143">40</text>
      <text x="176" y="181">50</text>
      <text x="194" y="219">60</text>
      <text x="446" y="257">200</text>
    </g>

    <text x="20" y="290" font-size="12" fill="#5b6b7a">共 6 个表，需要 5 次两两合并；每次合并后得到的新表参与后续合并。</text>
  </g>
</svg>
