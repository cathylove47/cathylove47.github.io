<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">LSI 的链式存储结构</title>
  <desc id="dsc">四个表头结点 R1 到 R4 各自挂一条链表，链结点依次保存对端 ID、本地 IP、费用；最后一结点的 next 为空。</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356c91"/></marker>
  </defs>
  <rect width="700" height="450" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#132c40">邻接表形式的链式存储（每个表头一条链）</text>

    <g font-size="11" fill="#5b6b7a">
      <text x="30" y="52">表头：Router ID</text>
      <text x="200" y="52">链结点：对端 ID / 本地 IP / 费用</text>
    </g>

    <!-- headers -->
    <g fill="#dfeaf3" stroke="#356c91">
      <rect x="30" y="62" width="130" height="42" rx="6"/>
      <rect x="30" y="132" width="130" height="42" rx="6"/>
      <rect x="30" y="202" width="130" height="42" rx="6"/>
      <rect x="30" y="272" width="130" height="42" rx="6"/>
    </g>
    <g font-size="12" fill="#132c40">
      <text x="44" y="88">R1 · 10.1.1.1</text>
      <text x="44" y="158">R2 · 10.1.1.2</text>
      <text x="44" y="228">R3 · 10.1.1.5</text>
      <text x="44" y="298">R4 · 10.1.1.6</text>
    </g>

    <!-- chain nodes -->
    <g fill="#f7fafc" stroke="#8a9aa8">
      <rect x="200" y="62" width="140" height="42" rx="6"/><rect x="360" y="62" width="140" height="42" rx="6"/><rect x="520" y="62" width="140" height="42" rx="6"/>
      <rect x="200" y="132" width="140" height="42" rx="6"/><rect x="360" y="132" width="140" height="42" rx="6"/><rect x="520" y="132" width="140" height="42" rx="6"/>
      <rect x="200" y="202" width="140" height="42" rx="6"/><rect x="360" y="202" width="140" height="42" rx="6"/><rect x="520" y="202" width="140" height="42" rx="6"/>
      <rect x="200" y="272" width="140" height="42" rx="6"/><rect x="360" y="272" width="140" height="42" rx="6"/><rect x="520" y="272" width="140" height="42" rx="6"/>
    </g>

    <g font-size="11" fill="#132c40">
      <text x="212" y="80">R2</text><text x="212" y="97">10.1.1.1 · 3</text>
      <text x="372" y="80">R3</text><text x="372" y="97">10.1.1.9 · 2</text>
      <text x="532" y="80">Net1</text><text x="532" y="97">192.1.1.0/24 · 1</text>

      <text x="212" y="150">R1</text><text x="212" y="167">10.1.1.2 · 3</text>
      <text x="372" y="150">R4</text><text x="372" y="167">10.1.1.13 · 4</text>
      <text x="532" y="150">Net6</text><text x="532" y="167">192.1.6.0/24 · 1</text>

      <text x="212" y="220">R4</text><text x="212" y="237">10.1.1.5 · 6</text>
      <text x="372" y="220">R1</text><text x="372" y="237">10.1.1.10 · 2</text>
      <text x="532" y="220">Net5</text><text x="532" y="237">192.1.5.0/24 · 1</text>

      <text x="212" y="290">R3</text><text x="212" y="307">10.1.1.6 · 6</text>
      <text x="372" y="290">R2</text><text x="372" y="307">10.1.1.14 · 4</text>
      <text x="532" y="290">Net7</text><text x="532" y="307">192.1.7.0/24 · 1</text>
    </g>

    <!-- arrows: header -> first, between nodes, last -> nil -->
    <g stroke="#356c91" stroke-width="1.5" marker-end="url(#a)">
      <line x1="160" y1="83" x2="198" y2="83"/>
      <line x1="160" y1="153" x2="198" y2="153"/>
      <line x1="160" y1="223" x2="198" y2="223"/>
      <line x1="160" y1="293" x2="198" y2="293"/>

      <line x1="340" y1="83" x2="358" y2="83"/>
      <line x1="340" y1="153" x2="358" y2="153"/>
      <line x1="340" y1="223" x2="358" y2="223"/>
      <line x1="340" y1="293" x2="358" y2="293"/>

      <line x1="500" y1="83" x2="518" y2="83"/>
      <line x1="500" y1="153" x2="518" y2="153"/>
      <line x1="500" y1="223" x2="518" y2="223"/>
      <line x1="500" y1="293" x2="518" y2="293"/>
    </g>
    <g font-size="14" fill="#5b6b7a">
      <text x="664" y="88">∧</text><text x="664" y="158">∧</text>
      <text x="664" y="228">∧</text><text x="664" y="298">∧</text>
    </g>

    <text x="20" y="348" font-size="12" fill="#5b6b7a">表头结点保存本路由器的 Router ID 与指向第一条链表的指针；</text>
    <text x="20" y="370" font-size="12" fill="#5b6b7a">链结点保存对端 Router ID、该链路在本路由器的 IP、费用，以及 next 指针。</text>
    <text x="20" y="392" font-size="12" fill="#5b6b7a">子网也抽象成链结点，用前缀代替对端 ID，费用为 1。</text>
    <text x="20" y="414" font-size="12" fill="#5b6b7a">R1 的两条链路分别通向 R2（费用 3）与 R3（费用 2）。</text>
  </g>
</svg>
