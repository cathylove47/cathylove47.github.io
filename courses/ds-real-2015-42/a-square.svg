  <text x="62.0" y="320.0" font-size="12" fill="#1f2d3d" text-anchor="start" font-weight="bold">A²[0][3] = 3 的含义：</text>
  <text x="62.0" y="342.0" font-size="11" fill="#5a6b7b" text-anchor="start">从顶点 0 到顶点 3 的长度为 2 的路径共 3 条：</text>
  <text x="74.0" y="364.0" font-size="11.5" fill="#2f6fed" text-anchor="start" font-weight="bold">0 → 1 → 3</text>
  <text x="74.0" y="384.0" font-size="11.5" fill="#2f6fed" text-anchor="start" font-weight="bold">0 → 2 → 3</text>
  <text x="74.0" y="404.0" font-size="11.5" fill="#2f6fed" text-anchor="start" font-weight="bold">0 → 4 → 3</text>
  <text x="62.0" y="442.0" font-size="10.5" fill="#5a6b7b" text-anchor="start">长度 = 边的条数；路径允许重复经过顶点，故可折返。</text>
