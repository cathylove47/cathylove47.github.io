<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="2016 年第 42 题：结点数的最大值与最小值">
