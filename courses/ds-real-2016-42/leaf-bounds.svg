  <text x="470.0" y="70.0" font-size="11.5" fill="#1f8a5f" text-anchor="middle" font-weight="bold">最少：1+(h−1)k = 1+2×3 = 7</text>
  <text x="470.0" y="268.0" font-size="10.5" fill="#1f8a5f" text-anchor="middle">第 1 至 h−1 层各仅 1 个非叶结点；第 h 层全为叶子</text>
  <text x="18.0" y="306.0" font-size="10.5" fill="#5a6b7b" text-anchor="start">下界来源：前 h−1 层每层至少 1 个非叶结点 ⇒ 第 2 至 h 层每层至少 k 个结点；任意正则 k 叉树的叶数恒为 (k−1)m+1。</text>
