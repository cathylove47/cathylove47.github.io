  <circle cx="70.0" cy="450.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="70.0" y="453.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">XA</text>
  <circle cx="250.0" cy="450.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="250.0" y="453.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">BJ</text>
  <circle cx="430.0" cy="450.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="430.0" y="453.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">TL</text>
  <circle cx="70.0" cy="554.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="70.0" y="557.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">WH</text>
  <circle cx="430.0" cy="554.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="430.0" y="557.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">JN</text>
  <circle cx="70.0" cy="658.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="70.0" y="661.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">CS</text>
  <circle cx="250.0" cy="658.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="250.0" y="661.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">QD</text>
  <circle cx="430.0" cy="658.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="430.0" y="661.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">NJ</text>
  <text x="18.0" y="706.0" font-size="11" fill="#1f8a5f" text-anchor="start">两方案总费用相同，但连通形状不同 ⇒ 第 (3) 问的 TTL 结论随方案而变。</text>
</svg>
