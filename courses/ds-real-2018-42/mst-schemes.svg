  <text x="416.0" y="506.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">2</text>
  <line x1="250.0" y1="658.0" x2="430.0" y2="554.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
  <text x="347.0" y="622.1" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">2</text>
  <line x1="250.0" y1="658.0" x2="430.0" y2="658.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
  <text x="340.0" y="676.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">2</text>
  <line x1="70.0" y1="554.0" x2="250.0" y2="658.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
  <text x="153.0" y="622.1" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">3</text>
  <line x1="70.0" y1="658.0" x2="250.0" y2="658.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
