  <circle cx="250.0" cy="346.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="250.0" y="349.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">QD</text>
  <circle cx="430.0" cy="346.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
