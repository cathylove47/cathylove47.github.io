  <text x="160.0" y="156.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">2</text>
  <line x1="250.0" y1="138.0" x2="430.0" y2="138.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
  <text x="340.0" y="156.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">3</text>
  <line x1="70.0" y1="138.0" x2="70.0" y2="242.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
  <text x="56.0" y="194.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">2</text>
  <line x1="430.0" y1="138.0" x2="430.0" y2="242.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
  <text x="416.0" y="194.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">2</text>
  <line x1="250.0" y1="346.0" x2="430.0" y2="242.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
  <text x="347.0" y="310.1" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">2</text>
  <line x1="250.0" y1="346.0" x2="430.0" y2="346.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
  <text x="340.0" y="364.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">2</text>
  <line x1="70.0" y1="346.0" x2="250.0" y2="346.0" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
  <text x="160.0" y="364.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="70.0" cy="138.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="70.0" y="141.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">XA</text>
