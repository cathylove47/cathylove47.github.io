<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 722" width="520" height="722" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="2018 年第 42 题：全部最经济方案">
  <title>2018 年第 42 题：全部最经济方案</title>
  <desc>两个最小生成树方案，均含五条权 2 的边与两条权 3 的边，总费用 16。</desc>
  <rect width="520" height="722" fill="#f5f8fc"/>
  <text x="16" y="26" font-size="15" font-weight="bold" fill="#1f2d3d">2018 年第 42 题：全部最经济方案</text>
  <text x="18.0" y="56.0" font-size="11.5" fill="#5a6b7b" text-anchor="start">两种方案都是最小生成树，总费用都是 2+2+2+2+2+3+3 = 16</text>
  <text x="18.0" y="76.0" font-size="12" fill="#1f2d3d" text-anchor="start" font-weight="bold">方案一：保留 TL—BJ 直连（TL 与 BJ 相邻）</text>
