  <text x="250.0" y="141.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">BJ</text>
  <circle cx="430.0" cy="138.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="430.0" y="141.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">TL</text>
  <circle cx="70.0" cy="242.0" r="17" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="70.0" y="245.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">WH</text>
