<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 318" width="520" height="318" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="2020 年第 42 题：前缀特性的含义">
  <title>2020 年第 42 题：前缀特性的含义</title>
  <desc>两组合法与非法的 0/1 编码对比，说明前缀特性的定义。</desc>
  <rect width="520" height="318" fill="#f5f8fc"/>
  <text x="16" y="26" font-size="15" font-weight="bold" fill="#1f2d3d">2020 年第 42 题：前缀特性的含义</text>
  <text x="18.0" y="50.0" font-size="11.5" fill="#5a6b7b" text-anchor="start">前缀特性：任一字符的编码都不是另一个字符编码的前缀</text>
  <text x="24.0" y="96.0" font-size="12" fill="#1f8a5f" text-anchor="start" font-weight="bold">① 具有前缀特性</text>
  <text x="24.0" y="122.0" font-size="13" fill="#1f2d3d" text-anchor="start">A = 0</text>
  <text x="24.0" y="146.0" font-size="13" fill="#1f2d3d" text-anchor="start">B = 10</text>
  <text x="150.0" y="134.0" font-size="11" fill="#1f8a5f" text-anchor="start">0 不是 10 的前缀 ⇒ 合法</text>
  <text x="24.0" y="206.0" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">② 不具有前缀特性</text>
  <text x="24.0" y="232.0" font-size="13" fill="#1f2d3d" text-anchor="start">A = 0</text>
  <text x="24.0" y="256.0" font-size="13" fill="#1f2d3d" text-anchor="start">B = 01</text>
  <rect x="20" y="240" width="62" height="20" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="150.0" y="244.0" font-size="11" fill="#c0392b" text-anchor="start">B 的前 1 位就是 A 的编码 ⇒ 译码时</text>
  <text x="150.0" y="262.0" font-size="11" fill="#c0392b" text-anchor="start">出现二义性</text>
  <text x="300.0" y="96.0" font-size="11.5" fill="#5a6b7b" text-anchor="start">最长为 L 位 ⇒ 任何编码长度 ≤ L</text>
  <text x="300.0" y="118.0" font-size="11.5" fill="#5a6b7b" text-anchor="start">字符个数 ≥ 2 ⇒ 编码表至少有两项</text>
  <text x="18.0" y="300.0" font-size="10.5" fill="#5a6b7b" text-anchor="start">题目要求：为这种「不等长 + 前缀特性」的编码选一种数据结构，并给出译码与判定方法。</text>
</svg>
