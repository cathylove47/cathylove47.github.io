<svg xmlns="http://www.w3.org/2000/svg" width="900" height="492" viewBox="0 0 900 492" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">cmpCountSort 的 count 统计结果与 b 的填写位置</title>
  <desc id="dsc">a 为 25、-10、25、10、11、19，下标 0 到 5；count 依次为 5、0、4、1、2、3；因此 b 中依次为 -10、10、11、19、25、25。b[4] 来自 a[2]，b[5] 来自 a[0]，两个相等的 25 被颠倒了。</desc>
  <rect width="900" height="492" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2021 · 第 42 题：count 数组与 b[count[i]] = a[i]</text>
    <text x="24" y="52" font-size="12" fill="#5b6b7a">每一对 (i, j) 只让一个计数器加一：a[i] &lt; a[j] 时 count[j]++，否则 count[i]++。count[i] 就是 a[i] 排好序后应在的位置。</text>

    <g font-size="12" fill="#5b6b7a" text-anchor="middle">
      <text x="194" y="88">i = 0</text><text x="298" y="88">i = 1</text><text x="402" y="88">i = 2</text>
      <text x="506" y="88">i = 3</text><text x="610" y="88">i = 4</text><text x="714" y="88">i = 5</text>
    </g>

    <!-- a row -->
    <text x="118" y="133" font-size="13" text-anchor="end" fill="#5b6b7a">a[i]</text>
    <g stroke="#356c91" stroke-width="1.6">
      <rect x="146" y="104" width="96" height="44" fill="#fbe4e6"/>
      <rect x="250" y="104" width="96" height="44" fill="#e8f1f8"/>
      <rect x="354" y="104" width="96" height="44" fill="#fbe4e6"/>
      <rect x="458" y="104" width="96" height="44" fill="#e8f1f8"/>
      <rect x="562" y="104" width="96" height="44" fill="#e8f1f8"/>
      <rect x="666" y="104" width="96" height="44" fill="#e8f1f8"/>
    </g>
    <g font-size="17" font-weight="bold" text-anchor="middle">
      <text x="194" y="133">25</text><text x="298" y="133">-10</text><text x="402" y="133">25</text>
      <text x="506" y="133">10</text><text x="610" y="133">11</text><text x="714" y="133">19</text>
    </g>

    <!-- count row -->
    <text x="118" y="213" font-size="13" text-anchor="end" fill="#5b6b7a">count[i]</text>
    <g stroke="#8a9aa8" stroke-width="1.4" fill="#ffffff">
      <rect x="146" y="184" width="96" height="44"/>
      <rect x="250" y="184" width="96" height="44"/>
      <rect x="354" y="184" width="96" height="44"/>
      <rect x="458" y="184" width="96" height="44"/>
      <rect x="562" y="184" width="96" height="44"/>
      <rect x="666" y="184" width="96" height="44"/>
    </g>
    <g font-size="17" text-anchor="middle" fill="#8a2f3b" font-weight="bold">
      <text x="194" y="213">5</text><text x="298" y="213">0</text><text x="402" y="213">4</text>
      <text x="506" y="213">1</text><text x="610" y="213">2</text><text x="714" y="213">3</text>
    </g>

    <text x="24" y="264" font-size="12" fill="#8a5a12">count[0] = 5、count[2] = 4：两个 25 分别落到 b[5] 与 b[4]，谁先谁后由 count 值决定。</text>

    <!-- b row -->
    <text x="118" y="340" font-size="13" text-anchor="end" fill="#5b6b7a">b[k]</text>
    <g font-size="12" fill="#5b6b7a" text-anchor="middle">
      <text x="194" y="304">k = 0</text><text x="298" y="304">1</text><text x="402" y="304">2</text>
      <text x="506" y="304">3</text><text x="610" y="304">4</text><text x="714" y="304">5</text>
    </g>
    <g stroke="#1e7a4f" stroke-width="1.8">
      <rect x="146" y="314" width="96" height="52" fill="#dff0e7"/>
      <rect x="250" y="314" width="96" height="52" fill="#dff0e7"/>
      <rect x="354" y="314" width="96" height="52" fill="#dff0e7"/>
      <rect x="458" y="314" width="96" height="52" fill="#dff0e7"/>
      <rect x="562" y="314" width="96" height="52" fill="#fbe4e6"/>
      <rect x="666" y="314" width="96" height="52" fill="#fbe4e6"/>
    </g>
    <g font-size="16" font-weight="bold" text-anchor="middle">
      <text x="194" y="338">-10</text><text x="298" y="338">10</text><text x="402" y="338">11</text>
      <text x="506" y="338">19</text><text x="610" y="338">25</text><text x="714" y="338">25</text>
    </g>
    <g font-size="10.5" text-anchor="middle" fill="#8a2f3b">
      <text x="610" y="357">来自 a[2]</text><text x="714" y="357">来自 a[0]</text>
    </g>

    <g font-size="12">
      <text x="24" y="398" fill="#8a2f3b">两个相等的 25 交换了原有先后次序（原来 a[0] 在前），所以 cmpCountSort 不稳定。</text>
      <text x="24" y="422" fill="#5b6b7a">count 的来历：count[0] 由 (0,1)(0,3)(0,4)(0,5) 四对“25 更大”累加，加上 (0,2) 相等也走 else，共 5；</text>
      <text x="24" y="444" fill="#5b6b7a">count[2] 由 (0,2)(1,2) 两对走“a[i] &lt; a[j]”分支累加，加上 (2,3)(2,4)(2,5) 三对走 else，共 4。</text>
      <text x="24" y="470" fill="#5b6b7a">比较总对数 = 15 = 6×5/2，与 n(n−1)/2 一致；每种输入都恰好比较这么多次，与数据是否有序无关。</text>
    </g>
  </g>
</svg>
