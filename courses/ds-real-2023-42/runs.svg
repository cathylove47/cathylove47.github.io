<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">2023 · 第 42 题：三个初始归并段</title>
  <desc id="dsc">第 1 段 6 个记录，第 2 段 9 个记录，第 3 段 4 个记录，合计 19 个记录，恰好覆盖全部输入。</desc>
  <rect width="940" height="430" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2023 · 第 42 题：三个初始归并段</text>

    <text x="24" y="132" font-size="13" font-weight="bold">第 1 段</text><text x="24" y="152" font-size="11" fill="#5b6b7a">长度 6</text><rect x="110" y="110" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="135" y="132" font-size="13" text-anchor="middle">37</text><rect x="166" y="110" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="191" y="132" font-size="13" text-anchor="middle">51</text><rect x="222" y="110" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="247" y="132" font-size="13" text-anchor="middle">63</text><rect x="278" y="110" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="303" y="132" font-size="13" text-anchor="middle">92</text><rect x="334" y="110" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="359" y="132" font-size="13" text-anchor="middle">94</text><rect x="390" y="110" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="415" y="132" font-size="13" text-anchor="middle">99</text><text x="24" y="198" font-size="13" font-weight="bold">第 2 段</text><text x="24" y="218" font-size="11" fill="#5b6b7a">长度 9</text><rect x="110" y="176" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="135" y="198" font-size="13" text-anchor="middle">14</text><rect x="166" y="176" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="191" y="198" font-size="13" text-anchor="middle">15</text><rect x="222" y="176" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="247" y="198" font-size="13" text-anchor="middle">23</text><rect x="278" y="176" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="303" y="198" font-size="13" text-anchor="middle">31</text><rect x="334" y="176" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="359" y="198" font-size="13" text-anchor="middle">48</text><rect x="390" y="176" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="415" y="198" font-size="13" text-anchor="middle">56</text><rect x="446" y="176" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="471" y="198" font-size="13" text-anchor="middle">60</text><rect x="502" y="176" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="527" y="198" font-size="13" text-anchor="middle">90</text><rect x="558" y="176" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="583" y="198" font-size="13" text-anchor="middle">166</text><text x="24" y="264" font-size="13" font-weight="bold">第 3 段</text><text x="24" y="284" font-size="11" fill="#5b6b7a">长度 4</text><rect x="110" y="242" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="135" y="264" font-size="13" text-anchor="middle">8</text><rect x="166" y="242" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="191" y="264" font-size="13" text-anchor="middle">17</text><rect x="222" y="242" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="247" y="264" font-size="13" text-anchor="middle">43</text><rect x="278" y="242" width="50" height="34" fill="#e8f1f8" stroke="#356c91"/><text x="303" y="264" font-size="13" text-anchor="middle">100</text>
    <line x1="24" y1="316" x2="916" y2="316" stroke="#cfd8e0"/>
    <text x="24" y="342" font-size="12" fill="#1e7a4f">段内关键字严格递增：37&lt;51&lt;63&lt;92&lt;94&lt;99；14&lt;15&lt;23&lt;31&lt;48&lt;56&lt;60&lt;90&lt;166；8&lt;17&lt;43&lt;100。</text>
    <text x="24" y="364" font-size="12" fill="#5b6b7a">6 + 9 + 4 = 19，且排序后关键字集合与输入完全一致，说明没有记录丢失或重复。</text>
    <text x="24" y="384" font-size="12" fill="#5b6b7a">平均段长 19/3 ≈ 6.3，明显优于“每段固定 m = 4 个”的内部排序做法（那样要 5 段）。</text>
  </g>
