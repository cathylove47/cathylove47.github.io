<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">最终散列表与查找 14、查找 8 的探测路线</title>
  <desc id="dsc">槽 0 到 10 依次是 11、空、14、7、空、20、9、空、空、3、18。查找 14 依次比较 HT[9]=3、HT[10]=18、HT[2]=14，比较序列 3、18、14。查找 8 从 HT[2] 起依次比较 14、7、9、11，最后落到空槽 7，确认失败地址为 7。</desc>
  <rect width="960" height="470" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2024 · 第 42 题：构造结果与两次查找的访问次序</text>
    <text x="24" y="56" font-size="12" fill="#5b6b7a">槽号在上、关键字在下；蓝色底纹 = 查找 14 走过的槽，绿色 = 查找 8 最终落到的空槽（失败地址）。</text>
    <text x="24" y="78" font-size="12" fill="#5b6b7a">上排深蓝小圈 = 查找 14 的比较次序；下排小圈 = 查找 8 的探查次序（⑤ 落在空槽上，判定失败）。</text>
    <text x="24" y="104" font-size="12" fill="#5b6b7a">散列地址</text>
    <text x="78" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">0</text><rect x="44" y="136" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="78" y="165" font-size="15" font-weight="bold" text-anchor="middle">11</text><circle cx="78" cy="196" r="10" fill="#b23a48"/><text x="78" y="200" font-size="11" fill="#ffffff" text-anchor="middle">4</text><text x="158" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">1</text><rect x="124" y="136" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="158" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#9fadb9">空</text><text x="238" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">2</text><rect x="204" y="136" width="68" height="46" fill="#dfeaf4" stroke="#356c91" stroke-width="1.4"/><text x="238" y="165" font-size="15" font-weight="bold" text-anchor="middle">14</text><circle cx="238" cy="112" r="10" fill="#356c91"/><text x="238" y="116" font-size="11" fill="#ffffff" text-anchor="middle">3</text><circle cx="238" cy="196" r="10" fill="#b23a48"/><text x="238" y="200" font-size="11" fill="#ffffff" text-anchor="middle">1</text><text x="318" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">3</text><rect x="284" y="136" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="318" y="165" font-size="15" font-weight="bold" text-anchor="middle">7</text><circle cx="318" cy="196" r="10" fill="#b23a48"/><text x="318" y="200" font-size="11" fill="#ffffff" text-anchor="middle">2</text><text x="398" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">4</text><rect x="364" y="136" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="398" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#9fadb9">空</text><text x="478" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">5</text><rect x="444" y="136" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="478" y="165" font-size="15" font-weight="bold" text-anchor="middle">20</text><text x="558" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">6</text><rect x="524" y="136" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="558" y="165" font-size="15" font-weight="bold" text-anchor="middle">9</text><circle cx="558" cy="196" r="10" fill="#b23a48"/><text x="558" y="200" font-size="11" fill="#ffffff" text-anchor="middle">3</text><text x="638" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">7</text><rect x="604" y="136" width="68" height="46" fill="#dff0e7" stroke="#356c91" stroke-width="1.4"/><text x="638" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#9fadb9">空</text><circle cx="638" cy="196" r="10" fill="#1e7a4f"/><text x="638" y="200" font-size="11" fill="#ffffff" text-anchor="middle">5</text><text x="718" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">8</text><rect x="684" y="136" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="718" y="165" font-size="15" font-weight="bold" text-anchor="middle" fill="#9fadb9">空</text><text x="798" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">9</text><rect x="764" y="136" width="68" height="46" fill="#dfeaf4" stroke="#356c91" stroke-width="1.4"/><text x="798" y="165" font-size="15" font-weight="bold" text-anchor="middle">3</text><circle cx="798" cy="112" r="10" fill="#356c91"/><text x="798" y="116" font-size="11" fill="#ffffff" text-anchor="middle">1</text><text x="878" y="128" font-size="12" fill="#5b6b7a" text-anchor="middle">10</text><rect x="844" y="136" width="68" height="46" fill="#dfeaf4" stroke="#356c91" stroke-width="1.4"/><text x="878" y="165" font-size="15" font-weight="bold" text-anchor="middle">18</text><circle cx="878" cy="112" r="10" fill="#356c91"/><text x="878" y="116" font-size="11" fill="#ffffff" text-anchor="middle">2</text>

    <text x="24" y="248" font-size="13" fill="#356c91">查找 14：H₀=9 → 比 3（冲突）→ H₁=10 → 比 18（冲突）→ H₂=2 → 比 14（命中）</text>
    <text x="24" y="270" font-size="12" fill="#5b6b7a">关键字比较序列：3、18、14（共比较 3 次，第 3 次成功）。</text>
    <text x="24" y="310" font-size="13" fill="#b23a48">查找 8：H₀=2 → 比 14 → H₁=3 → 比 7 → H₂=6 → 比 9 → H₃=0 → 比 11 → H₄=7 → 空槽，失败</text>
    <text x="24" y="332" font-size="12" fill="#5b6b7a">比较序列：14、7、9、11；直到 HT[7] 才遇到空槽，所以“确认查找失败时的散列地址”是 7，不是初始地址 2。</text>
    <text x="24" y="360" font-size="12" fill="#1e7a4f">二次探查序列 2→3→6→0→7 中途没有空槽，只能一路探到 7；这也是“失败地址”与“失败时的比较次数”不同之处。</text>
    <text x="24" y="388" font-size="12" fill="#5b6b7a">装填因子 α = 7 个关键字 / 11 个槽 = 7/11 ≈ 0.636；槽 1、4、7、8 空着，7 号槽正是 8 的落空点。</text>
    <text x="24" y="416" font-size="12" fill="#5b6b7a">若把失败地址误答成 H₀ = 2，就把“初始散列地址”当成了“最后一次探查的地址”，这是本题最常见的失分点。</text>
    <text x="24" y="444" font-size="12" fill="#5b6b7a">插入次序不能省：若先插 9 再插 20，两者的最终槽位会互换，整张表都会变。</text>
  </g>
</svg>
