<svg xmlns="http://www.w3.org/2000/svg" width="980" height="570" viewBox="0 0 980 570" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">七个关键字的探测链与最终地址</title>
  <desc id="dsc">20 直接到 5；3 直接到 9；11 直接到 0；18 直接到 10；9 的 H0 是 5 被占，探查 6 存入；14 的 H0 是 9 被占、H1 是 10 被占、H2 是 2 存入；7 的 H0 是 10 被占、H1 是 0 被占、H2 是 3 存入。</desc>
  <rect width="980" height="570" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2024 · 第 42 题：逐个插入时实际走过的探测链</text>
    <text x="24" y="56" font-size="12" fill="#5b6b7a">最左格是待插入关键字，中间是依次比较过的地址，绿色是最终存入的空槽；没有画出来的槽，这一步根本没有访问。</text>
    <text x="24" y="78" font-size="12" fill="#5b6b7a">只有与“已存关键字”比较才算冲突：插入 9 时先比较 HT[5]=20 才冲突一次。</text>
    <rect x="40" y="96" width="56" height="34" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="68" y="119" font-size="14" font-weight="bold" text-anchor="middle">20</text><rect x="132" y="96" width="64" height="34" fill="#dff0e7" stroke="#1e7a4f" stroke-width="2"/><text x="164" y="118" font-size="12" text-anchor="middle">H₀=5</text><text x="220" y="118" font-size="12" fill="#1e7a4f">存入 HT[5]</text><rect x="40" y="158" width="56" height="34" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="68" y="181" font-size="14" font-weight="bold" text-anchor="middle">3</text><rect x="132" y="158" width="64" height="34" fill="#dff0e7" stroke="#1e7a4f" stroke-width="2"/><text x="164" y="180" font-size="12" text-anchor="middle">H₀=9</text><text x="220" y="180" font-size="12" fill="#1e7a4f">存入 HT[9]</text><rect x="40" y="220" width="56" height="34" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="68" y="243" font-size="14" font-weight="bold" text-anchor="middle">11</text><rect x="132" y="220" width="64" height="34" fill="#dff0e7" stroke="#1e7a4f" stroke-width="2"/><text x="164" y="242" font-size="12" text-anchor="middle">H₀=0</text><text x="220" y="242" font-size="12" fill="#1e7a4f">存入 HT[0]</text><rect x="40" y="282" width="56" height="34" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="68" y="305" font-size="14" font-weight="bold" text-anchor="middle">18</text><rect x="132" y="282" width="64" height="34" fill="#dff0e7" stroke="#1e7a4f" stroke-width="2"/><text x="164" y="304" font-size="12" text-anchor="middle">H₀=10</text><text x="220" y="304" font-size="12" fill="#1e7a4f">存入 HT[10]</text><rect x="40" y="344" width="56" height="34" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="68" y="367" font-size="14" font-weight="bold" text-anchor="middle">9</text><rect x="132" y="344" width="64" height="34" fill="#ffffff" stroke="#9fadb9" stroke-width="1.2"/><text x="164" y="366" font-size="12" text-anchor="middle">H₀=5</text><path d="M 196 361 L 214 361" stroke="#8a9aa8" stroke-width="1.4" marker-end="url(#ar)"/><rect x="214" y="344" width="64" height="34" fill="#dff0e7" stroke="#1e7a4f" stroke-width="2"/><text x="246" y="366" font-size="12" text-anchor="middle">H₁=6</text><text x="302" y="366" font-size="12" fill="#1e7a4f">存入 HT[6]</text><text x="414" y="366" font-size="11" fill="#5b6b7a">冲突 1 次</text><rect x="40" y="406" width="56" height="34" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="68" y="429" font-size="14" font-weight="bold" text-anchor="middle">14</text><rect x="132" y="406" width="64" height="34" fill="#ffffff" stroke="#9fadb9" stroke-width="1.2"/><text x="164" y="428" font-size="12" text-anchor="middle">H₀=9</text><path d="M 196 423 L 214 423" stroke="#8a9aa8" stroke-width="1.4" marker-end="url(#ar)"/><rect x="214" y="406" width="64" height="34" fill="#ffffff" stroke="#9fadb9" stroke-width="1.2"/><text x="246" y="428" font-size="12" text-anchor="middle">H₁=10</text><path d="M 278 423 L 296 423" stroke="#8a9aa8" stroke-width="1.4" marker-end="url(#ar)"/><rect x="296" y="406" width="64" height="34" fill="#dff0e7" stroke="#1e7a4f" stroke-width="2"/><text x="328" y="428" font-size="12" text-anchor="middle">H₂=2</text><text x="384" y="428" font-size="12" fill="#1e7a4f">存入 HT[2]</text><text x="496" y="428" font-size="11" fill="#5b6b7a">冲突 2 次</text><rect x="40" y="468" width="56" height="34" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="68" y="491" font-size="14" font-weight="bold" text-anchor="middle">7</text><rect x="132" y="468" width="64" height="34" fill="#ffffff" stroke="#9fadb9" stroke-width="1.2"/><text x="164" y="490" font-size="12" text-anchor="middle">H₀=10</text><path d="M 196 485 L 214 485" stroke="#8a9aa8" stroke-width="1.4" marker-end="url(#ar)"/><rect x="214" y="468" width="64" height="34" fill="#ffffff" stroke="#9fadb9" stroke-width="1.2"/><text x="246" y="490" font-size="12" text-anchor="middle">H₁=0</text><path d="M 278 485 L 296 485" stroke="#8a9aa8" stroke-width="1.4" marker-end="url(#ar)"/><rect x="296" y="468" width="64" height="34" fill="#dff0e7" stroke="#1e7a4f" stroke-width="2"/><text x="328" y="490" font-size="12" text-anchor="middle">H₂=3</text><text x="384" y="490" font-size="12" fill="#1e7a4f">存入 HT[3]</text><text x="496" y="490" font-size="11" fill="#5b6b7a">冲突 2 次</text>
    <text x="24" y="552" font-size="12" fill="#1e7a4f">7 个关键字写入 7 个不同的槽，装填因子 α = 7/11 ≈ 0.636。</text>
  </g>
</svg>
