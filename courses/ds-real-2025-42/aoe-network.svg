<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="520" viewBox="0 0 1020 520" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">2025 年第 42 题 AOE 网（12 个活动）</title>
  <desc id="dsc">7 个顶点、12 条带权有向边：a=1→3 权 2，b=1→2 权 5，c=3→6 权 1，d=1→4 权 3，e=3→4 权 3，f=4→2 权 4，g=4→6 权 1，h=6→7 权 1，j=4→5 权 1，k=2→5 权 2，m=4→7 权 4，n=7→5 权 3。</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#356c91"/>
    </marker>
    <marker id="arwc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b23a48"/>
    </marker>
  </defs>
  <rect width="1020" height="520" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">

    <text x="24" y="34" font-size="15" font-weight="bold">2025 · 第 42 题 AOE 网：顶点 1～7，活动 a～n（无 i、l）</text>
    <text x="24" y="56" font-size="12" fill="#5b6b7a">边上标注“活动名 = 持续时间”；顶点 1 为源点（开工），顶点 5 为汇点（完工）。</text>

    <!-- edges -->
    <g stroke="#356c91" stroke-width="1.8" fill="none" marker-end="url(#arw)">
      <path d="M 101 198 L 256 133"/>          <!-- a 1->3 -->
      <path d="M 98 226 L 470 424"/>           <!-- b 1->2 -->
      <path d="M 104 224 L 256 388"/>          <!-- d 1->4 -->
      <path d="M 304 130 L 467 197"/>          <!-- c 3->6 -->
      <path d="M 280 144 L 280 376"/>          <!-- e 3->4 -->
      <path d="M 302 410 L 467 436"/>          <!-- f 4->2 -->
      <path d="M 300 388 L 469 224"/>          <!-- g 4->6 -->
      <path d="M 514 216 L 678 235"/>          <!-- h 6->7 -->
      <path d="M 300 405 L 897 306"/>          <!-- j 4->5 -->
      <path d="M 514 434 L 897 311"/>          <!-- k 2->5 -->
      <path d="M 296 386 L 678 253"/>          <!-- m 4->7 -->
      <path d="M 724 244 L 897 293"/>          <!-- n 7->5 -->
    </g>

    <!-- edge labels -->
    <g font-size="13" font-weight="bold" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
      <text x="176" y="152">a = 2</text>
      <text x="172" y="262">b = 5</text>
      <text x="388" y="150">c = 1</text>
      <text x="206" y="336">d = 3</text>
      <text x="300" y="262">e = 3</text>
      <text x="388" y="414">f = 4</text>
      <text x="362" y="298">g = 1</text>
      <text x="592" y="212">h = 1</text>
      <text x="612" y="344">j = 1</text>
      <text x="700" y="386">k = 2</text>
      <text x="500" y="332">m = 4</text>
      <text x="812" y="256">n = 3</text>
    </g>

    <!-- nodes -->
    <g>
      <circle cx="80" cy="210" r="26" fill="#e8f1f8" stroke="#356c91" stroke-width="2"/>
      <text x="80" y="216" font-size="16" font-weight="bold" text-anchor="middle">1</text>

      <circle cx="280" cy="120" r="26" fill="#e8f1f8" stroke="#356c91" stroke-width="2"/>
      <text x="280" y="126" font-size="16" font-weight="bold" text-anchor="middle">3</text>

      <circle cx="280" cy="400" r="26" fill="#e8f1f8" stroke="#356c91" stroke-width="2"/>
      <text x="280" y="406" font-size="16" font-weight="bold" text-anchor="middle">4</text>

      <circle cx="490" cy="210" r="26" fill="#e8f1f8" stroke="#356c91" stroke-width="2"/>
      <text x="490" y="216" font-size="16" font-weight="bold" text-anchor="middle">6</text>

      <circle cx="490" cy="440" r="26" fill="#e8f1f8" stroke="#356c91" stroke-width="2"/>
      <text x="490" y="446" font-size="16" font-weight="bold" text-anchor="middle">2</text>

      <circle cx="700" cy="240" r="26" fill="#e8f1f8" stroke="#356c91" stroke-width="2"/>
      <text x="700" y="246" font-size="16" font-weight="bold" text-anchor="middle">7</text>

      <circle cx="920" cy="300" r="26" fill="#e8f1f8" stroke="#356c91" stroke-width="2"/>
      <text x="920" y="306" font-size="16" font-weight="bold" text-anchor="middle">5</text>
    </g>

    <!-- legend -->
    <g font-size="12" fill="#5b6b7a">
      <text x="24" y="486">活动共 12 个：a b c d e f g h j k m n；源点 1、汇点 5。解题时先按拓扑序求 ve，再逆拓扑序求 vl。</text>
      <text x="24" y="506">本图按题面边表重绘，未做任何改动：1→3 a2、1→2 b5、3→6 c1、1→4 d3、3→4 e3、4→2 f4、4→6 g1、6→7 h1、4→5 j1、2→5 k2、4→7 m4、7→5 n3。</text>
    </g>
  </g>
</svg>
