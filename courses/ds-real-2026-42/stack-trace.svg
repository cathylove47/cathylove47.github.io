<svg xmlns="http://www.w3.org/2000/svg" width="980" height="740" viewBox="0 0 980 740" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">2026 · 第 42 题：两条序列的栈轨迹与 312 模式</title>
  <desc id="dsc">序列一在输出 6 之后无法输出 4，因为 5 压在 4 上方；序列二可以完整走完，栈最终为空。序列一的第 4、5、7 个输出值 6、4、5 构成 P_j &lt; P_k &lt; P_i 的禁用模式。</desc>
  <rect width="980" height="740" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#356c91"/>
    </marker>
  </defs>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2026 · 第 42 题：两条序列的栈轨迹与 312 模式</text>

    <text x="24" y="72" font-size="13" font-weight="bold" fill="#b23a48">序列一 {2,3,1,6,4,7,5,9,8}：不可行</text><text x="24" y="92" font-size="11" fill="#5b6b7a">输出值　　栈内（底 → 顶）　　操作</text><text x="32" y="116" font-size="13" fill="#132c40">2</text><text x="80" y="116" font-size="12" fill="#132c40">[1]</text><text x="200" y="116" font-size="11.5" fill="#5b6b7a">压 1、压 2，弹出 2</text><text x="32" y="148" font-size="13" fill="#132c40">3</text><text x="80" y="148" font-size="12" fill="#132c40">[1]</text><text x="200" y="148" font-size="11.5" fill="#5b6b7a">压 3，弹出 3</text><text x="32" y="180" font-size="13" fill="#132c40">1</text><text x="80" y="180" font-size="12" fill="#132c40">[ ]</text><text x="200" y="180" font-size="11.5" fill="#5b6b7a">弹出 1，栈清空</text><text x="32" y="212" font-size="13" fill="#132c40">6</text><text x="80" y="212" font-size="12" fill="#132c40">[4, 5]</text><text x="200" y="212" font-size="11.5" fill="#5b6b7a">压 4、压 5、压 6，弹出 6</text><rect x="24" y="224" width="440" height="28" fill="#fbe4e6"/><text x="32" y="244" font-size="13" fill="#132c40">4</text><text x="80" y="244" font-size="12" fill="#132c40">[4, 5]</text><text x="200" y="244" font-size="11.5" fill="#5b6b7a">要 4，但 5 压在 4 上面 → 只能先出 5，失败</text><text x="24" y="290" font-size="13" font-weight="bold" fill="#1e7a4f">序列二 {2,3,1,5,6,7,4,9,8}：可行</text><text x="24" y="310" font-size="11" fill="#5b6b7a">输出值　　栈内（底 → 顶）　　操作</text><text x="32" y="334" font-size="13" fill="#132c40">2</text><text x="80" y="334" font-size="12" fill="#132c40">[1]</text><text x="200" y="334" font-size="11.5" fill="#5b6b7a">压 1、压 2，弹出 2</text><text x="32" y="364" font-size="13" fill="#132c40">3</text><text x="80" y="364" font-size="12" fill="#132c40">[1]</text><text x="200" y="364" font-size="11.5" fill="#5b6b7a">压 3，弹出 3</text><text x="32" y="394" font-size="13" fill="#132c40">1</text><text x="80" y="394" font-size="12" fill="#132c40">[ ]</text><text x="200" y="394" font-size="11.5" fill="#5b6b7a">弹出 1，栈清空</text><text x="32" y="424" font-size="13" fill="#132c40">5</text><text x="80" y="424" font-size="12" fill="#132c40">[4]</text><text x="200" y="424" font-size="11.5" fill="#5b6b7a">压 4、压 5，弹出 5</text><text x="32" y="454" font-size="13" fill="#132c40">6</text><text x="80" y="454" font-size="12" fill="#132c40">[4]</text><text x="200" y="454" font-size="11.5" fill="#5b6b7a">压 6，弹出 6</text><text x="32" y="484" font-size="13" fill="#132c40">7</text><text x="80" y="484" font-size="12" fill="#132c40">[4]</text><text x="200" y="484" font-size="11.5" fill="#5b6b7a">压 7，弹出 7</text><text x="32" y="514" font-size="13" fill="#132c40">4</text><text x="80" y="514" font-size="12" fill="#132c40">[ ]</text><text x="200" y="514" font-size="11.5" fill="#5b6b7a">弹出 4</text><text x="32" y="544" font-size="13" fill="#132c40">9</text><text x="80" y="544" font-size="12" fill="#132c40">[8]</text><text x="200" y="544" font-size="11.5" fill="#5b6b7a">压 8、压 9，弹出 9</text><text x="32" y="574" font-size="13" fill="#132c40">8</text><text x="80" y="574" font-size="12" fill="#132c40">[ ]</text><text x="200" y="574" font-size="11.5" fill="#5b6b7a">弹出 8，栈清空</text><text x="24" y="630" font-size="12" fill="#b23a48">失败的根因（312 模式）：取输出序列的第 4、5、7 个元素，得 P₄=6、P₅=4、P₇=5，满足</text><text x="24" y="654" font-size="14" font-weight="bold" fill="#b23a48">P₅ = 4 &lt; P₇ = 5 &lt; P₄ = 6（其中 i = 4、j = 5、k = 7，即 Pj &lt; Pk &lt; Pi）</text><text x="24" y="678" font-size="12" fill="#5b6b7a">三个下标 i &lt; j &lt; k 上一次“两头夹”：最大的先出（6），最小的垫底（4），中间值夹在中间（5），</text><text x="24" y="698" font-size="12" fill="#5b6b7a">栈无法在不违反后进先出的前提下完成这种相对次序，所以序列一不可行；序列二不含任何 312 模式。</text>
  </g>
</svg>
