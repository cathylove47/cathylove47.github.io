<svg xmlns="http://www.w3.org/2000/svg" width="856" height="384" viewBox="0 0 856 384" role="img"><title>虚实地址转换与 Cache 访问链路</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356c91"/></marker>
<marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b8473a"/></marker></defs>
<rect width="856" height="384" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#132c40" font-size="14">
<text x="24.0" y="32.0" font-size="17" fill="#132c40" text-anchor="start" font-weight="bold">一次访存的完整链路：虚拟地址 → TLB → 页表 → 物理地址 → Cache → 主存</text><rect x="24" y="60" width="150" height="56" rx="8" fill="#fbeee6" stroke="#b8473a" stroke-width="1.5"/><text x="99.0" y="83.4" font-size="14" fill="#132c40" text-anchor="middle" font-weight="bold">虚拟地址</text><text x="99.0" y="102.4" font-size="14" fill="#132c40" text-anchor="middle" font-weight="bold">VPN | 页内偏移</text><rect x="220" y="60" width="150" height="56" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="295.0" y="83.4" font-size="14" fill="#132c40" text-anchor="middle">查 TLB</text><text x="295.0" y="102.4" font-size="14" fill="#132c40" text-anchor="middle">组号 = VPN 低位</text><rect x="420" y="60" width="150" height="56" rx="8" fill="#e3f1ea" stroke="#2f7d5b" stroke-width="1.5"/><text x="495.0" y="92.9" font-size="14" fill="#132c40" text-anchor="middle">得到 PFN</text><rect x="620" y="60" width="170" height="56" rx="8" fill="#fbeee6" stroke="#b8473a" stroke-width="1.5"/><text x="705.0" y="83.4" font-size="14" fill="#132c40" text-anchor="middle" font-weight="bold">物理地址</text><text x="705.0" y="102.4" font-size="14" fill="#132c40" text-anchor="middle" font-weight="bold">PFN | 页内偏移</text><line x1="174.0" y1="88.0" x2="218.0" y2="88.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="370.0" y1="88.0" x2="418.0" y2="88.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><text x="394.0" y="80.0" font-size="12" fill="#2f7d5b" text-anchor="middle">命中</text><line x1="570.0" y1="88.0" x2="618.0" y2="88.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="220" y="160" width="150" height="56" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="295.0" y="183.4" font-size="14" fill="#132c40" text-anchor="middle">查页表（主存）</text><text x="295.0" y="202.4" font-size="14" fill="#132c40" text-anchor="middle">多访存一次</text><line x1="295.0" y1="116.0" x2="295.0" y2="158.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><text x="302.0" y="142.0" font-size="12" fill="#b8473a" text-anchor="start">未命中</text><line x1="370.0" y1="188.0" x2="470.0" y2="118.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><text x="432.0" y="172.0" font-size="12" fill="#2f7d5b" text-anchor="start">有效：回填 TLB</text><rect x="220" y="262" width="150" height="64" rx="8" fill="#fbe3df" stroke="#b8473a" stroke-width="1.5"/><text x="295.0" y="289.4" font-size="14" fill="#132c40" text-anchor="middle" font-weight="bold">缺页异常</text><text x="295.0" y="308.4" font-size="14" fill="#132c40" text-anchor="middle" font-weight="bold">陷入内核</text><line x1="295.0" y1="216.0" x2="295.0" y2="260.0" stroke="#b8473a" stroke-width="1.8" marker-end="url(#arrowR)"/><text x="302.0" y="244.0" font-size="12" fill="#b8473a" text-anchor="start">有效位 = 0</text><rect x="420" y="262" width="200" height="64" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="520.0" y="289.6" font-size="13" fill="#132c40" text-anchor="middle">选牺牲页（LRU/FIFO）</text><text x="520.0" y="307.6" font-size="13" fill="#132c40" text-anchor="middle">脏页先写回 → 调入 → 改页表</text><line x1="370.0" y1="294.0" x2="418.0" y2="294.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M520 326 L520 350 L120 350 L120 116" fill="none" stroke="#b8473a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowR)"/><text x="130.0" y="368.0" font-size="12" fill="#b8473a" text-anchor="start">I/O 完成后重新执行原访存指令</text><rect x="660" y="160" width="170" height="56" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="745.0" y="183.6" font-size="13" fill="#132c40" text-anchor="middle">Cache 地址拆分</text><text x="745.0" y="201.6" font-size="13" fill="#132c40" text-anchor="middle">标记 | 组号 | 块内</text><line x1="705.0" y1="116.0" x2="725.0" y2="158.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="660" y="262" width="80" height="56" rx="8" fill="#e3f1ea" stroke="#2f7d5b" stroke-width="1.5"/><text x="700.0" y="285.6" font-size="13" fill="#132c40" text-anchor="middle">命中</text><text x="700.0" y="303.6" font-size="13" fill="#132c40" text-anchor="middle">取数据</text><rect x="752" y="262" width="80" height="56" rx="8" fill="#fbe3df" stroke="#b8473a" stroke-width="1.5"/><text x="792.0" y="285.6" font-size="13" fill="#132c40" text-anchor="middle">缺失</text><text x="792.0" y="303.6" font-size="13" fill="#132c40" text-anchor="middle">主存调块</text><line x1="720.0" y1="216.0" x2="705.0" y2="260.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="770.0" y1="216.0" x2="790.0" y2="260.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/>
</g></svg>