<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img"><title>BFS 求无权图最短路径</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356c91"/></marker>
<marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b8473a"/></marker></defs>
<rect width="720" height="352" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#132c40" font-size="14">
<text x="24.0" y="32.0" font-size="17" fill="#132c40" text-anchor="start" font-weight="bold">BFS 按层扩展：第一次入队时的层数就是最短边数</text><rect x="28.0" y="50" width="124" height="260" rx="10" fill="#fbeee6"/><text x="90.0" y="72.0" font-size="13" fill="#6b7c89" text-anchor="middle">第 0 层</text><rect x="204.7" y="50" width="124" height="260" rx="10" fill="#e8f0f6"/><text x="266.7" y="72.0" font-size="13" fill="#6b7c89" text-anchor="middle">第 1 层</text><rect x="381.4" y="50" width="124" height="260" rx="10" fill="#e3f1ea"/><text x="443.4" y="72.0" font-size="13" fill="#6b7c89" text-anchor="middle">第 2 层</text><rect x="558.1" y="50" width="124" height="260" rx="10" fill="#f3eefa"/><text x="620.1" y="72.0" font-size="13" fill="#6b7c89" text-anchor="middle">第 3 层</text><line x1="114.2" y1="170.4" x2="241.0" y2="120.3" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="114.2" y1="189.6" x2="241.0" y2="239.7" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="293.0" y1="110.0" x2="415.0" y2="110.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="287.3" y1="233.8" x2="421.1" y2="127.4" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="293.0" y1="250.0" x2="415.0" y2="250.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="467.2" y1="119.6" x2="594.0" y2="169.7" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="467.2" y1="240.4" x2="594.0" y2="190.3" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="90" cy="180" r="24" fill="#ffffff" stroke="#132c40" stroke-width="2"/><text x="90.0" y="185.0" font-size="16" fill="#132c40" text-anchor="middle" font-weight="bold">0</text><text x="90.0" y="224.0" font-size="13" fill="#b8473a" text-anchor="middle">d=0</text><circle cx="267" cy="110" r="24" fill="#ffffff" stroke="#132c40" stroke-width="2"/><text x="267.0" y="115.0" font-size="16" fill="#132c40" text-anchor="middle" font-weight="bold">1</text><text x="267.0" y="154.0" font-size="13" fill="#b8473a" text-anchor="middle">d=1</text><circle cx="267" cy="250" r="24" fill="#ffffff" stroke="#132c40" stroke-width="2"/><text x="267.0" y="255.0" font-size="16" fill="#132c40" text-anchor="middle" font-weight="bold">2</text><text x="267.0" y="294.0" font-size="13" fill="#b8473a" text-anchor="middle">d=1</text><circle cx="443" cy="110" r="24" fill="#ffffff" stroke="#132c40" stroke-width="2"/><text x="443.0" y="115.0" font-size="16" fill="#132c40" text-anchor="middle" font-weight="bold">3</text><text x="443.0" y="154.0" font-size="13" fill="#b8473a" text-anchor="middle">d=2</text><circle cx="443" cy="250" r="24" fill="#ffffff" stroke="#132c40" stroke-width="2"/><text x="443.0" y="255.0" font-size="16" fill="#132c40" text-anchor="middle" font-weight="bold">4</text><text x="443.0" y="294.0" font-size="13" fill="#b8473a" text-anchor="middle">d=2</text><circle cx="620" cy="180" r="24" fill="#ffffff" stroke="#132c40" stroke-width="2"/><text x="620.0" y="185.0" font-size="16" fill="#132c40" text-anchor="middle" font-weight="bold">5</text><text x="620.0" y="224.0" font-size="13" fill="#b8473a" text-anchor="middle">d=3</text><text x="24.0" y="336.0" font-size="13" fill="#6b7c89" text-anchor="start">出队顺序 0, 1, 2, 3, 4, 5。顶点 3 能从 1、2 两处到达，但只在第一次被发现时记录 d = 2。</text>
</g></svg>