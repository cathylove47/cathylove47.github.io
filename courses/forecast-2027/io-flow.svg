<svg xmlns="http://www.w3.org/2000/svg" width="900" height="408" viewBox="0 0 900 408" role="img"><title>read 系统调用读磁盘的事件顺序</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356c91"/></marker>
<marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b8473a"/></marker></defs>
<rect width="900" height="408" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#132c40" font-size="14">
<text x="24.0" y="32.0" font-size="17" fill="#132c40" text-anchor="start" font-weight="bold">read() 读磁盘：三条泳道上的 7 个事件</text><rect x="24" y="52" width="852" height="100" rx="8" fill="#f6f9fb" stroke="#c9d7e1"/><text x="36.0" y="72.0" font-size="13" fill="#6b7c89" text-anchor="start" font-weight="bold">用户进程</text><rect x="24" y="162" width="852" height="100" rx="8" fill="#ffffff" stroke="#c9d7e1"/><text x="36.0" y="182.0" font-size="13" fill="#6b7c89" text-anchor="start" font-weight="bold">内核：系统调用 / 设备无关层 / 驱动</text><rect x="24" y="272" width="852" height="100" rx="8" fill="#f6f9fb" stroke="#c9d7e1"/><text x="36.0" y="292.0" font-size="13" fill="#6b7c89" text-anchor="start" font-weight="bold">磁盘控制器</text><rect x="40" y="84" width="104" height="58" rx="8" fill="#fbeee6" stroke="#b8473a" stroke-width="1.5"/><text x="92.0" y="108.5" font-size="13" fill="#132c40" text-anchor="middle">① 调用 read</text><text x="92.0" y="126.5" font-size="13" fill="#132c40" text-anchor="middle">陷入内核</text><rect x="160" y="194" width="104" height="58" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="212.0" y="218.6" font-size="13" fill="#132c40" text-anchor="middle">② 查缓冲、</text><text x="212.0" y="236.6" font-size="13" fill="#132c40" text-anchor="middle">检查参数</text><line x1="144.0" y1="113.0" x2="160.0" y2="223.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="280" y="194" width="104" height="58" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="332.0" y="218.6" font-size="13" fill="#132c40" text-anchor="middle">③ 驱动写</text><text x="332.0" y="236.6" font-size="13" fill="#132c40" text-anchor="middle">控制器寄存器</text><line x1="264.0" y1="223.0" x2="280.0" y2="223.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="400" y="84" width="104" height="58" rx="8" fill="#fbeee6" stroke="#b8473a" stroke-width="1.5"/><text x="452.0" y="108.5" font-size="13" fill="#132c40" text-anchor="middle">④ 进程阻塞</text><text x="452.0" y="126.5" font-size="13" fill="#132c40" text-anchor="middle">调度他进程</text><line x1="384.0" y1="223.0" x2="400.0" y2="113.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="520" y="304" width="104" height="58" rx="8" fill="#e3f1ea" stroke="#2f7d5b" stroke-width="1.5"/><text x="572.0" y="328.6" font-size="13" fill="#132c40" text-anchor="middle">⑤ 数据就绪</text><text x="572.0" y="346.6" font-size="13" fill="#132c40" text-anchor="middle">发中断</text><line x1="504.0" y1="113.0" x2="520.0" y2="333.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="194" width="104" height="58" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="692.0" y="218.6" font-size="13" fill="#132c40" text-anchor="middle">⑥ 中断处理</text><text x="692.0" y="236.6" font-size="13" fill="#132c40" text-anchor="middle">唤醒进程</text><line x1="624.0" y1="333.0" x2="640.0" y2="223.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="760" y="194" width="104" height="58" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="812.0" y="218.6" font-size="13" fill="#132c40" text-anchor="middle">⑦ 内核缓冲</text><text x="812.0" y="236.6" font-size="13" fill="#132c40" text-anchor="middle">复制到用户区</text><line x1="744.0" y1="223.0" x2="760.0" y2="223.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><text x="450.0" y="392.0" font-size="13" fill="#6b7c89" text-anchor="middle">③ 之后 CPU 不空等：④ 阻塞让出 CPU；中断只把进程置为就绪（⑥），它重新被调度后才完成 ⑦</text>
</g></svg>