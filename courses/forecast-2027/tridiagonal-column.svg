47.0" y="318.0" font-size="15" fill="#132c40" text-anchor="middle" font-weight="bold">13</text><rect x="270" y="290" width="46" height="46" fill="#e8f0f6" stroke="#356c91"/><text x="293.0" y="318.0" font-size="15" fill="#132c40" text-anchor="middle" font-weight="bold">15</text><text x="63.0" y="52.0" font-size="12" fill="#6b7c89" text-anchor="middle">j=1</text><text x="109.0" y="52.0" font-size="12" fill="#6b7c89" text-anchor="middle">j=2</text><text x="155.0" y="52.0" font-size="12" fill="#6b7c89" text-anchor="middle">j=3</text><text x="201.0" y="52.0" font-size="12" fill="#6b7c89" text-anchor="middle">j=4</text><text x="247.0" y="52.0" font-size="12" fill="#6b7c89" text-anchor="middle">j=5</text><text x="293.0" y="52.0" font-size="12" fill="#6b7c89" text-anchor="middle">j=6</text><text x="356.0" y="90.0" font-size="14" fill="#132c40" text-anchor="start">第 1 列 2 个，中间各列 3 个，最后 1 列 2 个。</text><text x="356.0" y="122.0" font-size="14" fill="#132c40" text-anchor="start">a(i,j) 之前的完整列：2 + 3(j−2) = 3j − 4 个</text><text x="356.0" y="154.0" font-size="14" fill="#132c40" text-anchor="start">在第 j 列内的位次（从 0 起）：i − (j − 1)</text><text x="356.0" y="194.0" font-size="18" fill="#b8473a" text-anchor="start" font-weight="bold">k = 2j + i − 3</text><text x="356.0" y="226.0" font-size="13" fill="#6b7c89" text-anchor="start">（i, j 从 1 起，B 从 0 起；行优先是 k = 2i + j − 3）</text><text x="356.0" y="266.0" font-size="14" fill="#356c91" text-anchor="start">验证：a(5,4) → 2×4 + 5 − 3 = 10 ✓</text>
