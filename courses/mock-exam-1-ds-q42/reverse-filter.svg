<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" aria-labelledby="title desc"><title id="title">逆置链表后按右侧最大值筛除结点</title><desc id="desc">输入5、2、13、3、8。逆置8、3、13、2、5，删除3、2、5，再逆置得到13、8。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#356c91"/></marker></defs><rect width="360" height="530" fill="#ffffff"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#132c40"><text x="16" y="28" fill="#132c40" font-size="16" font-weight="bold">先逆置 → 扫描最大值 → 再逆置</text><text x="16" y="59" fill="#132c40" font-size="14" font-weight="normal">① 原链表：需知道每个结点右侧的最大值</text><rect x="16" y="78" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="34" y="102" text-anchor="middle" font-size="16">5</text><path d="M53,97 H82" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="86" y="78" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="104" y="102" text-anchor="middle" font-size="16">2</text><path d="M123,97 H152" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="156" y="78" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="174" y="102" text-anchor="middle" font-size="16">13</text><path d="M193,97 H222" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="226" y="78" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="244" y="102" text-anchor="middle" font-size="16">3</text><path d="M263,97 H292" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="296" y="78" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="314" y="102" text-anchor="middle" font-size="16">8</text><text x="16" y="156" fill="#132c40" font-size="14" font-weight="normal">② 逆置：从原尾结点开始处理</text><rect x="16" y="177" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="34" y="201" text-anchor="middle" font-size="16">8</text><path d="M53,196 H82" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="86" y="177" width="36" height="38" rx="8" fill="#ffe2df" stroke="#b74d46"/><text x="104" y="201" text-anchor="middle" font-size="16">3</text><path d="M123,196 H152" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="156" y="177" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="174" y="201" text-anchor="middle" font-size="16">13</text><path d="M193,196 H222" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="226" y="177" width="36" height="38" rx="8" fill="#ffe2df" stroke="#b74d46"/><text x="244" y="201" text-anchor="middle" font-size="16">2</text><path d="M263,196 H292" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="296" y="177" width="36" height="38" rx="8" fill="#ffe2df" stroke="#b74d46"/><text x="314" y="201" text-anchor="middle" font-size="16">5</text><text x="16" y="250" fill="#132c40" font-size="14" font-weight="normal">8：保留，最大值 = 8</text><text x="16" y="278" fill="#a6433e" font-size="14" font-weight="normal">3：小于 8，删除</text><text x="16" y="306" fill="#132c40" font-size="14" font-weight="normal">13：保留，最大值 = 13</text><text x="16" y="334" fill="#a6433e" font-size="14" font-weight="normal">2、5：小于 13，删除</text><text x="16" y="383" fill="#132c40" font-size="14" font-weight="normal">③ 筛除后，再逆置回原顺序</text><rect x="16" y="406" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="34" y="430" text-anchor="middle" font-size="16">8</text><path d="M53,425 H82" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="86" y="406" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="104" y="430" text-anchor="middle" font-size="16">13</text><path d="M166 425H204" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="216" y="406" width="48" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="240" y="431" text-anchor="middle" font-size="16">13</text><path d="M267 425H291" stroke="#356c91" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="303" y="406" width="36" height="38" rx="8" fill="#e6f5eb" stroke="#4c8160"/><text x="321" y="431" text-anchor="middle" font-size="16">8</text><text x="16" y="479" fill="#132c40" font-size="14" font-weight="normal">严格小于才删；相等保留，尾结点必保留。</text><text x="16" y="507" fill="#132c40" font-size="14" font-weight="normal">三次线性扫描；固定指针，无辅助数组。</text></g></svg>