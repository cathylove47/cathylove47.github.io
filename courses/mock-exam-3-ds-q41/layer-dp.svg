<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="至多3条边分层动态规划：s到t路径与prev与cur双数组递推">
  <title>第41题：换乘不超过2次等于路径至多3条边的分层动态规划</title>
  <desc>上半部分给出 s 经 u、v 到 t 的3条边路径（等价于2次换乘）；下半部分给出按边数上限 k=0 到 3 逐层递推、每层用上一轮 prev 数组松弛得到本轮 cur 数组、再整体替换的双数组分层 DP。禁止就地单数组更新，否则一轮内可连锁走过超过3条边。</desc>
  <rect x="0" y="0" width="360" height="300" fill="#f7f9fc"/>
  <style>text{font-family:sans-serif}</style>

  <text x="12" y="20" font-size="12" font-weight="bold" fill="#1f2d3d">路径 s→u→v→t：3 条边 = 2 次换乘</text>

  <circle cx="46" cy="58" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="63" font-size="12" text-anchor="middle" fill="#1e3a8a">s</text>
  <circle cx="138" cy="58" r="15" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="138" y="63" font-size="12" text-anchor="middle" fill="#1e3a8a">u</text>
  <circle cx="230" cy="58" r="15" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="63" font-size="12" text-anchor="middle" fill="#1e3a8a">v</text>
  <circle cx="318" cy="58" r="15" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="318" y="63" font-size="12" text-anchor="middle" fill="#7c2d12">t</text>

  <line x1="61" y1="58" x2="123" y2="58" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="153" y1="58" x2="215" y2="58" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="245" y1="58" x2="303" y2="58" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="92" y="50" font-size="10" text-anchor="middle" fill="#475569">边1</text>
  <text x="184" y="50" font-size="10" text-anchor="middle" fill="#475569">边2</text>
  <text x="274" y="50" font-size="10" text-anchor="middle" fill="#475569">边3</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <line x1="12" y1="86" x2="348" y2="86" stroke="#cbd5e1" stroke-width="1"/>

  <text x="12" y="106" font-size="12" font-weight="bold" fill="#1f2d3d">按“至多 k 条边”分层递推（prev / cur 双数组）</text>

  <rect x="14" y="116" width="332" height="30" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="24" y="135" font-size="11" fill="#312e81">k=0：prev[s]=0，其余=∞</text>

  <rect x="14" y="152" width="332" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="24" y="171" font-size="11" fill="#312e81">第1轮：cur=prev 继承；再用 prev 松弛1条边 → 至多1条边</text>

  <rect x="14" y="188" width="332" height="30" rx="6" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.2"/>
  <text x="24" y="207" font-size="11" fill="#312e81">第2轮：prev←cur；松弛1条边 → 至多2条边</text>

  <rect x="14" y="224" width="332" height="30" rx="6" fill="#a5b4fc" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="24" y="243" font-size="11" fill="#1e1b4b">第3轮：prev←cur；松弛1条边 → 至多3条边</text>

  <rect x="14" y="260" width="332" height="30" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="24" y="279" font-size="11" fill="#7c2d12">答案 = prev[t]（仍为 ∞ 则返回 -1）；每轮必须整体换数组</text>
</svg>
