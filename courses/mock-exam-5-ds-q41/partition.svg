<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
<rect width="960" height="560" fill="#ffffff"/>
<text x="480.0" y="30" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">第 41 题：字符串大整数的比较规则与原地划分（求第 k 大，k = 4）</text>
<rect x="30" y="50" width="900" height="76" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="48" y="76" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">比较规则（两数均为通常十进制形式，无前导零）：</text>
<text x="48" y="102" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155" text-anchor="start" font-weight="400">① 位数（长度）多者数值大；② 位数相同则按字典序逐字符比较，首次不同的字符较大者为大。</text>
<text x="48" y="120" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155" text-anchor="start" font-weight="400">例：9 &lt; 120（1 位 vs 3 位）；120 &gt; 45（3 位 vs 2 位）；120 = 120。</text>
<text x="48" y="158" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">示例 nums = [9, 120, 45, 100000000000000000000, 120]，k = 4，要求第 4 大。</text>
<rect x="48" y="170" width="96" height="36" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
<text x="96.0" y="194" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">9</text>
<text x="96.0" y="220" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">0</text>
<rect x="158" y="170" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="206.0" y="194" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">120</text>
<text x="206.0" y="220" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">1</text>
<rect x="268" y="170" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="316.0" y="194" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">45</text>
<text x="316.0" y="220" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">2</text>
<rect x="378" y="170" width="210" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="483.0" y="194" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">100000000000000000000</text>
<text x="483.0" y="220" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">3</text>
<rect x="602" y="170" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="650.0" y="194" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">120</text>
<text x="650.0" y="220" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">4</text>
<text x="48" y="240" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">第 1 轮：以 nums[0] = 9 为枢轴，降序划分 → 枢轴落到下标 4，名次 5 &gt; 4，在左段 [0,3] 继续。</text>
<rect x="48" y="252" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="96.0" y="276" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">120</text>
<text x="96.0" y="302" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">0</text>
<rect x="158" y="252" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="206.0" y="276" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">120</text>
<text x="206.0" y="302" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">1</text>
<rect x="268" y="252" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="316.0" y="276" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">45</text>
<text x="316.0" y="302" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">2</text>
<rect x="378" y="252" width="210" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="483.0" y="276" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">100000000000000000000</text>
<text x="483.0" y="302" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">3</text>
<rect x="602" y="252" width="96" height="36" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
<text x="650.0" y="276" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">9</text>
<text x="650.0" y="302" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">4</text>
<text x="48" y="322" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">第 2 轮：以 nums[0] = 120 为枢轴划分 [0,3] → 枢轴落到下标 2，名次 3 &lt; 4，在右段 [3,3] 继续。</text>
<rect x="48" y="334" width="210" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="153.0" y="358" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">100000000000000000000</text>
<text x="153.0" y="384" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">0</text>
<rect x="272" y="334" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="320.0" y="358" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">120</text>
<text x="320.0" y="384" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">1</text>
<rect x="382" y="334" width="96" height="36" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
<text x="430.0" y="358" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">120</text>
<text x="430.0" y="384" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">2</text>
<rect x="492" y="334" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="540.0" y="358" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">45</text>
<text x="540.0" y="384" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">3</text>
<rect x="602" y="334" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="650.0" y="358" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">9</text>
<text x="650.0" y="384" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">4</text>
<text x="48" y="404" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">第 3 轮：段 [3,3] 只有 nums[3] = 45，枢轴落在下标 3，名次 4 = k → 直接返回 “45”。</text>
<rect x="48" y="416" width="210" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="153.0" y="440" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">100000000000000000000</text>
<text x="153.0" y="466" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">0</text>
<rect x="272" y="416" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="320.0" y="440" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">120</text>
<text x="320.0" y="466" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">1</text>
<rect x="382" y="416" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="430.0" y="440" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">120</text>
<text x="430.0" y="466" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">2</text>
<rect x="492" y="416" width="96" height="36" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
<text x="540.0" y="440" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">45</text>
<text x="540.0" y="466" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">3</text>
<rect x="602" y="416" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="650.0" y="440" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="400">9</text>
<text x="650.0" y="466" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400">4</text>
<rect x="30" y="476" width="900" height="66" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="48" y="500" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#065f46" text-anchor="start" font-weight="700">最终降序序列：100000000000000000000, 120, 120, 45, 9 → 第 4 大 = 45（与卷面示例一致）。</text>
<text x="48" y="524" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#065f46" text-anchor="start" font-weight="400">每轮只做一次划分，平均比较 O(n) 次，每次比较 O(L) → 平均 O(nL)；原地交换，额外空间 O(1)。</text>
</svg>
