<svg width="360" height="452" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 452" role="img" aria-labelledby="arTitle arDesc">
<title id="arTitle">单精度特殊值的典型算术与比较结果</title>
<desc id="arDesc">在默认就近舍入、非陷阱的 IEEE 算术下：1 除以正零为正无穷、除以负零为负无穷，零除以零、无穷减无穷、零乘无穷均为非数，无穷加有限数仍为无穷；正零与负零数值相等，非数与任何数比较都为假。</desc>
<rect x="0" y="0" width="360" height="452" fill="#f8fafc"/>
<text x="180" y="34" font-size="22" font-family="system-ui, sans-serif" font-weight="700" fill="#0f172a" text-anchor="middle">特殊值的算术与比较</text>
<text x="180" y="60" font-size="19" font-family="system-ui, sans-serif" fill="#475569" text-anchor="middle">默认就近舍入、非陷阱 IEEE 算术</text>

<rect x="10" y="74" width="340" height="116" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.6"/>
<text x="22" y="100" font-size="20" font-family="system-ui, sans-serif" font-weight="700" fill="#075985">① 除法与不定式</text>
<text x="22" y="130" font-size="20" font-family="system-ui, sans-serif" fill="#0f172a">1 ÷ (+0) = +∞</text>
<text x="22" y="158" font-size="20" font-family="system-ui, sans-serif" fill="#0f172a">1 ÷ (−0) = −∞</text>
<text x="22" y="186" font-size="20" font-family="system-ui, sans-serif" fill="#0f172a">0 ÷ 0 = NaN</text>

<rect x="10" y="200" width="340" height="104" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.6"/>
<text x="22" y="226" font-size="20" font-family="system-ui, sans-serif" font-weight="700" fill="#991b1b">② 无穷参与的不定式</text>
<text x="22" y="254" font-size="20" font-family="system-ui, sans-serif" fill="#0f172a">∞ − ∞ = NaN</text>
<text x="22" y="282" font-size="20" font-family="system-ui, sans-serif" fill="#0f172a">0 × ∞ = NaN</text>

<rect x="10" y="314" width="340" height="120" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.6"/>
<text x="22" y="340" font-size="20" font-family="system-ui, sans-serif" font-weight="700" fill="#166534">③ 无穷与比较</text>
<text x="22" y="368" font-size="20" font-family="system-ui, sans-serif" fill="#0f172a">∞ + 有限数 = ∞</text>
<text x="22" y="396" font-size="20" font-family="system-ui, sans-serif" fill="#0f172a">+0 = −0（数值相等）</text>
<text x="22" y="424" font-size="20" font-family="system-ui, sans-serif" fill="#0f172a">NaN ≠ NaN（比较一律为假）</text>
</svg>
