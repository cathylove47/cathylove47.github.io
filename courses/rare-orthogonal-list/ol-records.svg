<svg width="360" height="784" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 784" role="img" aria-labelledby="ttl dsc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<rect x="0" y="0" width="360" height="784" fill="#fffdf7"/>
<title id="ttl">十字链表的顶点结点表与弧结点表（本例全部字段值）</title>
<desc id="dsc">上表为顶点结点：V1 的 firstin 是 e3、firstout 是 e1；V2 的 firstin 是 e1、firstout 为空；V3 的 firstin 是 e2、firstout 是 e3；V4 的 firstin 是 e4、firstout 是 e5。下表为弧结点：e1 的 tailvex 为 0、headvex 为 1、hlink 为 e6、tlink 为 e2；e2 为 0 到 2、hlink 为 e7、tlink 为空；e3 为 2 到 0、hlink 为 e5、tlink 为 e4；e4 为 2 到 3、两个链接都为空；e5 为 3 到 0、hlink 为空、tlink 为 e6；e6 为 3 到 1、hlink 为空、tlink 为 e7；e7 为 3 到 2、两个链接都为空。</desc>
<rect x="8" y="8" width="344" height="276" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="20" y="36" font-size="18" text-anchor="start" fill="#0f172a" font-weight="bold">顶点结点：每个顶点一个（顺序存放）</text>
<text x="20" y="62" font-size="17" text-anchor="start" fill="#1d4ed8">firstout：出边链的第 1 条弧（出去）</text>
<text x="20" y="86" font-size="17" text-anchor="start" fill="#b91c1c">firstin：入边链的第 1 条弧（进来）</text>
<text x="20" y="110" font-size="17" text-anchor="start" fill="#475569">下标：V1=0、V2=1、V3=2、V4=3</text>
