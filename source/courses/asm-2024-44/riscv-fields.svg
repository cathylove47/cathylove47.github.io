<svg xmlns="http://www.w3.org/2000/svg" width="600" height="302" viewBox="0 0 600 302" role="img" aria-labelledby="t"><title id="t">2024 编码与页号</title><rect width="600" height="302" rx="10" fill="#fff"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#17232e"><text x="20" y="30" font-size="17" fill="#17232e" text-anchor="start" font-weight="normal">2024 组成原理 44：slli 编码、小端地址与页号</text><rect x="20" y="58" width="95" height="44" fill="#f2f7fb" stroke="#356c91"/><text x="67.5" y="75" font-size="12" fill="#356c91" text-anchor="middle" font-weight="normal">funct7</text><text x="67.5" y="93" font-size="13" fill="#17232e" text-anchor="middle" font-weight="normal">0000000</text><rect x="115" y="58" width="70" height="44" fill="#f2f7fb" stroke="#356c91"/><text x="150.0" y="75" font-size="12" fill="#356c91" text-anchor="middle" font-weight="normal">shamt</text><text x="150.0" y="93" font-size="13" fill="#17232e" text-anchor="middle" font-weight="normal">00010</text><rect x="185" y="58" width="70" height="44" fill="#f2f7fb" stroke="#356c91"/><text x="220.0" y="75" font-size="12" fill="#356c91" text-anchor="middle" font-weight="normal">rs1</text><text x="220.0" y="93" font-size="13" fill="#17232e" text-anchor="middle" font-weight="normal">00010</text><rect x="255" y="58" width="70" height="44" fill="#f2f7fb" stroke="#356c91"/><text x="290.0" y="75" font-size="12" fill="#356c91" text-anchor="middle" font-weight="normal">f3</text><text x="290.0" y="93" font-size="13" fill="#17232e" text-anchor="middle" font-weight="normal">010</text><rect x="325" y="58" width="70" height="44" fill="#f2f7fb" stroke="#356c91"/><text x="360.0" y="75" font-size="12" fill="#356c91" text-anchor="middle" font-weight="normal">rd</text><text x="360.0" y="93" font-size="13" fill="#17232e" text-anchor="middle" font-weight="normal">00100</text><rect x="395" y="58" width="95" height="44" fill="#f2f7fb" stroke="#356c91"/><text x="442.5" y="75" font-size="12" fill="#356c91" text-anchor="middle" font-weight="normal">opcode</text><text x="442.5" y="93" font-size="13" fill="#17232e" text-anchor="middle" font-weight="normal">0010011</text><text x="20" y="132" font-size="15" fill="#17232e" text-anchor="start" font-weight="normal">slli r4,r2,2：rs1=r2、rd=r4、shamt=2</text><text x="20" y="160" font-size="16" fill="#b42318" text-anchor="start" font-weight="bold">拼成 32 位 = 0021 2213H</text><text x="20" y="196" font-size="15" fill="#17232e" text-anchor="start" font-weight="normal">a[5] 地址 = 0013 DFF0H + 5×4 = 0013 E004H</text><text x="20" y="224" font-size="15" fill="#17232e" text-anchor="start" font-weight="normal">按小端取 4 字节 DC EC FF FF ⇒ FFFF ECDCH</text><text x="20" y="252" font-size="15" fill="#b42318" text-anchor="start" font-weight="normal">sum = 0000 1332H + FFFF ECDCH = 0000 000EH（舍去进位）</text><text x="20" y="280" font-size="15" fill="#17232e" text-anchor="start" font-weight="normal">页号 = 0013 E004H &gt;&gt; 12 = 0013EH；数组跨 0013D、0013E 两页</text></g></svg>