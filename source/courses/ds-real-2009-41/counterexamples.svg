<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" role="img" aria-labelledby="title"><title id="title">2009 年第 41 题的两个反例</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526575"/></marker></defs><rect width="560" height="760" rx="12" fill="#fff"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#172b3a" font-size="16"><text x="20" y="30" font-size="20" fill="#172b3a" text-anchor="start" font-weight="normal">2009 · 第 41 题：两个反例</text><text x="20" y="62" font-size="17" fill="#b42318" text-anchor="start" font-weight="bold">反例一：走得到，但更长</text><path d="M125.9179129384734,175.43752551384074L256.3536636347692,115.80975376696266" stroke="#b42318" stroke-width="2.4" fill="none"  marker-end="url(#arrow)"/><rect x="179" y="127" width="22" height="21" fill="#fff" rx="3"/><text x="190" y="142" font-size="16" fill="#b42318" text-anchor="middle" font-weight="normal">1</text><path d="M280.0,128.0L280.0,239.0" stroke="#b42318" stroke-width="2.4" fill="none"  marker-end="url(#arrow)"/><rect x="292" y="197" width="22" height="21" fill="#fff" rx="3"/><text x="303" y="212" font-size="16" fill="#b42318" text-anchor="middle" font-weight="normal">1</text><path d="M300.9179129384734,255.43752551384074L431.3536636347692,195.80975376696264" stroke="#b42318" stroke-width="2.4" fill="none"  marker-end="url(#arrow)"/><rect x="364" y="213" width="22" height="21" fill="#fff" rx="3"/><text x="375" y="228" font-size="16" fill="#b42318" text-anchor="middle" font-weight="normal">1</text><path d="M128.0,185.0L429.0,185.0" stroke="#1a7f4b" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="387" y="161" width="22" height="21" fill="#fff" rx="3"/><text x="398" y="176" font-size="16" fill="#1a7f4b" text-anchor="middle" font-weight="normal">2</text><circle cx="105" cy="185" r="21" fill="#eef5fa" stroke="#356c91" stroke-width="2"/><text x="105" y="191" font-size="17" fill="#172b3a" text-anchor="middle" font-weight="normal">1</text><circle cx="280" cy="105" r="21" fill="#eef5fa" stroke="#356c91" stroke-width="2"/><text x="280" y="111" font-size="17" fill="#172b3a" text-anchor="middle" font-weight="normal">2</text><circle cx="280" cy="265" r="21" fill="#eef5fa" stroke="#356c91" stroke-width="2"/><text x="280" y="271" font-size="17" fill="#172b3a" text-anchor="middle" font-weight="normal">3</text><circle cx="455" cy="185" r="21" fill="#eef5fa" stroke="#356c91" stroke-width="2"/><text x="455" y="191" font-size="17" fill="#172b3a" text-anchor="middle" font-weight="normal">4</text><text x="20" y="312" font-size="15" fill="#b42318" text-anchor="start" font-weight="normal">红实线 1→2→3→4：费用 1+1+1 = 3</text><text x="20" y="338" font-size="15" fill="#1a7f4b" text-anchor="start" font-weight="normal">绿虚线 1→4 直达：费用 2，这才是最短路</text><text x="20" y="364" font-size="15" fill="#526575" text-anchor="start" font-weight="normal">方法只看下一步，从不比较“绕一圈”的总价</text><text x="20" y="412" font-size="17" fill="#b42318" text-anchor="start" font-weight="bold">反例二：中途停死，目标走不到</text><path d="M118.0,470.0L254.0,470.0" stroke="#b42318" stroke-width="2.4" fill="none"  marker-end="url(#arrow)"/><rect x="176" y="447" width="22" height="21" fill="#fff" rx="3"/><text x="187" y="462" font-size="16" fill="#b42318" text-anchor="middle" font-weight="normal">1</text><path d="M303.0,470.0L439.0,470.0" stroke="#b42318" stroke-width="2.4" fill="none"  marker-end="url(#arrow)"/><rect x="361" y="447" width="22" height="21" fill="#fff" rx="3"/><text x="372" y="462" font-size="16" fill="#b42318" text-anchor="middle" font-weight="normal">1</text><path d="M95.0,493.0L95.0,564.0" stroke="#1a7f4b" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="61" y="517" width="22" height="21" fill="#fff" rx="3"/><text x="72" y="532" font-size="16" fill="#1a7f4b" text-anchor="middle" font-weight="normal">2</text><circle cx="95" cy="470" r="21" fill="#eef5fa" stroke="#356c91" stroke-width="2"/><text x="95" y="476" font-size="17" fill="#172b3a" text-anchor="middle" font-weight="normal">1</text><circle cx="280" cy="470" r="21" fill="#eef5fa" stroke="#356c91" stroke-width="2"/><text x="280" y="476" font-size="17" fill="#172b3a" text-anchor="middle" font-weight="normal">2</text><circle cx="465" cy="470" r="21" fill="#eef5fa" stroke="#356c91" stroke-width="2"/><text x="465" y="476" font-size="17" fill="#172b3a" text-anchor="middle" font-weight="normal">4</text><circle cx="95" cy="590" r="21" fill="#eef5fa" stroke="#356c91" stroke-width="2"/><text x="95" y="596" font-size="17" fill="#172b3a" text-anchor="middle" font-weight="normal">3</text><text x="20" y="662" font-size="15" fill="#b42318" text-anchor="start" font-weight="normal">红实线：1→2→4，到 4 后无未访问邻点</text><text x="20" y="688" font-size="15" fill="#526575" text-anchor="start" font-weight="normal">方法停在 4；目标 3 始终没进路径</text><text x="20" y="714" font-size="15" fill="#1a7f4b" text-anchor="start" font-weight="normal">绿虚线 1→3 本来存在，费用 2</text></g></svg>