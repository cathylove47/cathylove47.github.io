<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">两种更短的查找方案</title>
  <desc id="dsc">左：按概率降序顺序查找，平均查找长度 2.10；右：二叉排序树，根 for，左右孩子 do 与 while，repeat 为 while 的左孩子，平均查找长度 2.0。</desc>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356c91"/></marker>
  </defs>
  <rect width="680" height="380" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#132c40">方案一：顺序查找（按概率降序）</text>

    <g font-size="12" fill="#5b6b7a">
      <text x="30" y="62">位次</text><text x="110" y="62">元素</text>
      <text x="190" y="62">概率</text><text x="268" y="62">贡献</text>
    </g>
    <g stroke="#c9d4de">
      <line x1="24" y1="70" x2="330" y2="70"/>
      <line x1="24" y1="106" x2="330" y2="106"/>
      <line x1="24" y1="140" x2="330" y2="140"/>
      <line x1="24" y1="174" x2="330" y2="174"/>
      <line x1="24" y1="208" x2="330" y2="208"/>
    </g>
    <g font-size="14" fill="#132c40">
      <text x="30" y="94">1</text><text x="110" y="94">do</text>
      <text x="190" y="94">0.35</text><text x="268" y="94">0.35</text>

      <text x="30" y="128">2</text><text x="110" y="128">while</text>
      <text x="190" y="128">0.35</text><text x="268" y="128">0.70</text>

      <text x="30" y="162">3</text><text x="110" y="162">for</text>
      <text x="190" y="162">0.15</text><text x="268" y="162">0.45</text>

      <text x="30" y="196">4</text><text x="110" y="196">repeat</text>
      <text x="190" y="196">0.15</text><text x="268" y="196">0.60</text>
    </g>
    <text x="24" y="238" font-size="13" fill="#1e7a4f">ASL = 0.35 + 0.70 + 0.45 + 0.60 = 2.10</text>
    <text x="24" y="264" font-size="12" fill="#5b6b7a">两个概率 0.35 的元素放前两位即可，内部次序可交换。</text>

    <line x1="344" y1="40" x2="344" y2="330" stroke="#e3e9ef"/>

    <text x="368" y="26" font-size="14" font-weight="bold" fill="#132c40">方案二：二叉排序树</text>

    <g stroke="#356c91" stroke-width="1.6" marker-end="url(#b)">
      <line x1="500" y1="100" x2="440" y2="146"/>
      <line x1="516" y1="100" x2="540" y2="146"/>
      <line x1="550" y1="190" x2="525" y2="228"/>
    </g>

    <circle cx="500" cy="78" r="24" fill="#eef4fa" stroke="#356c91"/>
    <text x="500" y="84" text-anchor="middle" font-size="14" fill="#132c40">for</text>
    <circle cx="424" cy="168" r="26" fill="#eef4fa" stroke="#356c91"/>
    <text x="424" y="174" text-anchor="middle" font-size="14" fill="#132c40">do</text>
    <circle cx="552" cy="168" r="26" fill="#eef4fa" stroke="#356c91"/>
    <text x="552" y="174" text-anchor="middle" font-size="14" fill="#132c40">while</text>
    <circle cx="514" cy="252" r="26" fill="#eef4fa" stroke="#356c91"/>
    <text x="514" y="258" text-anchor="middle" font-size="12" fill="#132c40">repeat</text>

    <g font-size="11" fill="#5b6b7a">
      <text x="500" y="44" text-anchor="middle">p=0.15 · 第1层</text>
      <text x="424" y="212" text-anchor="middle">p=0.35 · 第2层</text>
      <text x="580" y="172" text-anchor="start">p=0.35 · 第2层</text>
      <text x="514" y="296" text-anchor="middle">p=0.15 · 第3层</text>
    </g>

    <text x="368" y="332" font-size="13" fill="#1e7a4f">ASL = 0.15×1 + 0.35×2 + 0.35×2 + 0.15×3 = 2.0</text>
    <text x="368" y="356" font-size="12" fill="#5b6b7a">中序序列 do &lt; for &lt; repeat &lt; while，满足二叉排序树要求。</text>
  </g>
</svg>
