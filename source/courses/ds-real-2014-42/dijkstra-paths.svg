<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">以 R1 为根的最短路径树</title>
  <desc id="dsc">R1 距离 0；R3 距离 2；R2 距离 3；R4 距离 7；四个子网的费用分别为 1、3、4、8。</desc>
  <rect width="700" height="470" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#132c40">Dijkstra 结果：以 R1 为根的最短路径树</text>

    <g stroke="#c0392b" stroke-width="2.2">
      <line x1="306" y1="84" x2="155" y2="152"/>
      <line x1="312.5" y1="91.9" x2="267.5" y2="148.1"/>
      <line x1="351" y1="91.9" x2="429" y2="148.1"/>
      <line x1="250" y1="196" x2="245" y2="278"/>
      <line x1="450" y1="196" x2="455" y2="278"/>
      <line x1="469.8" y1="189.8" x2="540.2" y2="260.2"/>
      <line x1="560" y1="306" x2="605" y2="368"/>
    </g>
    <g font-size="12" fill="#c0392b" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3">
      <text x="232" y="112">1</text>
      <text x="296" y="130">2</text>
      <text x="398" y="136">3</text>
      <text x="231" y="234">1</text>
      <text x="438" y="234">1</text>
      <text x="518" y="220">4</text>
      <text x="568" y="330">1</text>
    </g>

    <g>
      <circle cx="330" cy="70" r="28" fill="#eef4fa" stroke="#356c91" stroke-width="1.8"/>
      <text x="330" y="68" text-anchor="middle" font-size="14" fill="#132c40">R1</text>
      <text x="330" y="86" text-anchor="middle" font-size="11" fill="#5b6b7a">d=0</text>

      <circle cx="250" cy="170" r="26" fill="#eef4fa" stroke="#356c91" stroke-width="1.8"/>
      <text x="250" y="168" text-anchor="middle" font-size="14" fill="#132c40">R3</text>
      <text x="250" y="185" text-anchor="middle" font-size="11" fill="#5b6b7a">d=2</text>

      <circle cx="450" cy="170" r="26" fill="#eef4fa" stroke="#356c91" stroke-width="1.8"/>
      <text x="450" y="168" text-anchor="middle" font-size="14" fill="#132c40">R2</text>
      <text x="450" y="185" text-anchor="middle" font-size="11" fill="#5b6b7a">d=3</text>

      <circle cx="560" cy="280" r="26" fill="#eef4fa" stroke="#356c91" stroke-width="1.8"/>
      <text x="560" y="278" text-anchor="middle" font-size="14" fill="#132c40">R4</text>
      <text x="560" y="295" text-anchor="middle" font-size="11" fill="#5b6b7a">d=7</text>
    </g>

    <g fill="#fff5f2" stroke="#c0392b">
      <rect x="20" y="154" width="150" height="32" rx="6"/>
      <rect x="170" y="280" width="150" height="32" rx="6"/>
      <rect x="380" y="280" width="150" height="32" rx="6"/>
      <rect x="530" y="370" width="150" height="32" rx="6"/>
    </g>
    <g font-size="12" fill="#132c40" text-anchor="middle">
      <text x="95" y="174">192.1.1.0/24</text>
      <text x="245" y="300">192.1.5.0/24</text>
      <text x="455" y="300">192.1.6.0/24</text>
      <text x="605" y="390">192.1.7.0/24</text>
    </g>
    <g font-size="11" fill="#c0392b" text-anchor="middle">
      <text x="95" y="206">费用 1</text>
      <text x="245" y="334">费用 3</text>
      <text x="455" y="334">费用 4</text>
      <text x="605" y="424">费用 8</text>
    </g>

    <text x="20" y="452" font-size="12" fill="#5b6b7a">每一步取当前距离最小的未确定顶点；每条边只保留产生最短距离的那一条。</text>
  </g>
</svg>
