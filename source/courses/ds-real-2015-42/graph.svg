<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 366" width="450" height="366" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="2015 年第 42 题：图 G">
  <title>2015 年第 42 题：图 G</title>
  <desc>五个顶点 0 到 4 的无向图，边为 0-1、0-2、0-4、1-3、1-4、2-3、3-4。</desc>
  <rect width="450" height="366" fill="#f5f8fc"/>
  <text x="16" y="26" font-size="15" font-weight="bold" fill="#1f2d3d">2015 年第 42 题：图 G</text>
  <text x="16.0" y="48.0" font-size="11.5" fill="#5a6b7b" text-anchor="start">无向图 G：5 个顶点、7 条边（交叉处不是顶点）</text>
  <line x1="150.0" y1="100.0" x2="300.0" y2="100.0" stroke="#7f8f9f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="150.0" y1="100.0" x2="60.0" y2="215.0" stroke="#7f8f9f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="150.0" y1="100.0" x2="390.0" y2="215.0" stroke="#7f8f9f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="300.0" y1="100.0" x2="225.0" y2="310.0" stroke="#7f8f9f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="300.0" y1="100.0" x2="390.0" y2="215.0" stroke="#7f8f9f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="60.0" y1="215.0" x2="225.0" y2="310.0" stroke="#7f8f9f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="225.0" y1="310.0" x2="390.0" y2="215.0" stroke="#7f8f9f" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="150.0" cy="100.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="150.0" y="105.0" font-size="14" fill="#1f2d3d" text-anchor="middle" font-weight="bold">0</text>
  <circle cx="300.0" cy="100.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="300.0" y="105.0" font-size="14" fill="#1f2d3d" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="60.0" cy="215.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="60.0" y="220.0" font-size="14" fill="#1f2d3d" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="390.0" cy="215.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="390.0" y="220.0" font-size="14" fill="#1f2d3d" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="225.0" cy="310.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="225.0" y="315.0" font-size="14" fill="#1f2d3d" text-anchor="middle" font-weight="bold">3</text>
  <text x="16.0" y="350.0" font-size="10.5" fill="#5a6b7b" text-anchor="start">顶点 0、1 在上；顶点 2 在左，4 在右，3 在下。边 0—4 与边 1—3 在图中间交叉。</text>
</svg>
