<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 370" width="430" height="370" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="2016 年第 42 题：正则 k 叉树">
  <title>2016 年第 42 题：正则 k 叉树</title>
  <desc>k 等于 3 的正则树示例，根与一个中间结点有 3 个孩子，其余为叶结点。</desc>
  <rect width="430" height="370" fill="#f5f8fc"/>
  <text x="16" y="26" font-size="15" font-weight="bold" fill="#1f2d3d">2016 年第 42 题：正则 k 叉树</text>
  <text x="18.0" y="48.0" font-size="11.5" fill="#5a6b7b" text-anchor="start">正则 3 叉树示例：每个非叶结点都恰好有 3 个孩子</text>
  <line x1="215.0" y1="88.0" x2="110.0" y2="178.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <line x1="215.0" y1="88.0" x2="215.0" y2="178.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <line x1="215.0" y1="88.0" x2="320.0" y2="178.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <line x1="215.0" y1="178.0" x2="160.0" y2="268.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <line x1="215.0" y1="178.0" x2="215.0" y2="268.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <line x1="215.0" y1="178.0" x2="270.0" y2="268.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="215.0" cy="88.0" r="18" fill="#dbe6f7" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="215.0" y="92.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">根</text>
  <circle cx="110.0" cy="178.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="110.0" y="182.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">叶</text>
  <circle cx="215.0" cy="178.0" r="18" fill="#dbe6f7" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="215.0" y="182.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">内</text>
  <circle cx="320.0" cy="178.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="320.0" y="182.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">叶</text>
  <circle cx="160.0" cy="268.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="160.0" y="272.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">叶</text>
  <circle cx="215.0" cy="268.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="215.0" y="272.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">叶</text>
  <circle cx="270.0" cy="268.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="270.0" y="272.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">叶</text>
  <rect x="18" y="316" width="14" height="14" fill="#dbe6f7" stroke="#1f2d3d" stroke-width="1.6"/>
  <text x="40.0" y="328.0" font-size="11" fill="#1f2d3d" text-anchor="start">非叶结点（度恰为 k = 3）</text>
  <rect x="200" y="316" width="14" height="14" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.6"/>
  <text x="222.0" y="328.0" font-size="11" fill="#1f2d3d" text-anchor="start">叶结点（无孩子）</text>
  <text x="18.0" y="354.0" font-size="10.5" fill="#5a6b7b" text-anchor="start">本题的树高 h 按「结点的层数」计：单结点树 h = 1。</text>
</svg>
