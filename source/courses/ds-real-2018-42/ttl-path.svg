<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="2018 年第 42 题：TTL 与跳数">
  <title>2018 年第 42 题：TTL 与跳数</title>
  <desc>两种方案下 TL 到 BJ 的转发路径，逐跳标注到达时的 TTL 值。</desc>
  <rect width="780" height="372" fill="#f5f8fc"/>
  <text x="16" y="26" font-size="15" font-weight="bold" fill="#1f2d3d">2018 年第 42 题：TTL 与跳数</text>
  <text x="18.0" y="56.0" font-size="11.5" fill="#5a6b7b" text-anchor="start">TL → BJ 沿所选方案逐跳转发，每经过一个路由器 TTL 减 1，减到 0 即丢弃</text>
  <rect x="14.0" y="104" width="52" height="32" rx="6" fill="#eef3fb" stroke="#2f6fed" stroke-width="1.6"/>
  <text x="40.0" y="124.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">H1</text>
  <rect x="157.0" y="104" width="66" height="32" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="1.6"/>
  <text x="190.0" y="124.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">TL</text>
  <line x1="66.0" y1="120.0" x2="155.0" y2="120.0" stroke="#2f6fed" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="307.0" y="104" width="66" height="32" rx="6" fill="#ffffff" stroke="#2f6fed" stroke-width="1.6"/>
  <text x="340.0" y="124.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">BJ</text>
  <line x1="223.0" y1="120.0" x2="305.0" y2="120.0" stroke="#2f6fed" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="464.0" y="104" width="52" height="32" rx="6" fill="#eef3fb" stroke="#2f6fed" stroke-width="1.6"/>
  <text x="490.0" y="124.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">H2</text>
  <line x1="373.0" y1="120.0" x2="462.0" y2="120.0" stroke="#2f6fed" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="190.0" y="94.0" font-size="9.5" fill="#5a6b7b" text-anchor="middle">到达 TTL 5</text>
  <text x="340.0" y="94.0" font-size="9.5" fill="#5a6b7b" text-anchor="middle">到达 TTL 4</text>
  <text x="18.0" y="164.0" font-size="10.5" fill="#2f6fed" text-anchor="start" font-weight="bold">经过 2 个路由器：TL 收到 5、转发后 4，BJ 收到 4、转发后 3 —— 仍大于 0，H2 能收到。</text>
  <rect x="14.0" y="234" width="52" height="32" rx="6" fill="#eef3fb" stroke="#c0392b" stroke-width="1.6"/>
  <text x="40.0" y="254.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">H1</text>
  <rect x="104.1" y="234" width="66" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
  <text x="137.1" y="254.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">TL</text>
  <line x1="66.0" y1="250.0" x2="102.1" y2="250.0" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="201.3" y="234" width="66" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
  <text x="234.3" y="254.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">JN</text>
  <line x1="170.1" y1="250.0" x2="199.3" y2="250.0" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="298.4" y="234" width="66" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
  <text x="331.4" y="254.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">QD</text>
  <line x1="267.3" y1="250.0" x2="296.4" y2="250.0" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="395.6" y="234" width="66" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
  <text x="428.6" y="254.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">WH</text>
  <line x1="364.4" y1="250.0" x2="393.6" y2="250.0" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="492.7" y="234" width="66" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
  <text x="525.7" y="254.0" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-weight="bold">XA</text>
  <line x1="461.6" y1="250.0" x2="490.7" y2="250.0" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="589.9" y="234" width="66" height="32" rx="6" fill="#ffffff" stroke="#c7d2de" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="622.9" y="254.0" font-size="10.5" fill="#5a6b7b" text-anchor="middle" font-weight="bold">BJ</text>
  <line x1="558.7" y1="250.0" x2="587.9" y2="250.0" stroke="#c7d2de" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/>
  <rect x="694.0" y="234" width="52" height="32" rx="6" fill="#eef3fb" stroke="#c7d2de" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="720.0" y="254.0" font-size="10.5" fill="#5a6b7b" text-anchor="middle" font-weight="bold">H2</text>
  <line x1="655.9" y1="250.0" x2="692.0" y2="250.0" stroke="#c7d2de" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="137.1" y="224.0" font-size="9.5" fill="#5a6b7b" text-anchor="middle">到达 TTL 5</text>
  <text x="234.3" y="224.0" font-size="9.5" fill="#5a6b7b" text-anchor="middle">到达 TTL 4</text>
  <text x="331.4" y="224.0" font-size="9.5" fill="#5a6b7b" text-anchor="middle">到达 TTL 3</text>
  <text x="428.6" y="224.0" font-size="9.5" fill="#5a6b7b" text-anchor="middle">到达 TTL 2</text>
  <text x="525.7" y="224.0" font-size="9.5" fill="#c0392b" text-anchor="middle" font-weight="bold">到达 TTL 1</text>
  <text x="525.7" y="286.0" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="bold">TTL 减到 0 → 丢弃</text>
  <text x="18.0" y="312.0" font-size="10.5" fill="#c0392b" text-anchor="start" font-weight="bold">路径共 6 个路由器：XA 收到 TTL=1，减 1 得 0 即丢弃，分组根本到不了 BJ，H2 收不到。</text>
  <text x="18.0" y="344.0" font-size="11" fill="#1f8a5f" text-anchor="start">判断口径是「经过的路由器个数」：两个方案分别是 2 个和 6 个路由器，TTL=5 只够前者。</text>
  <text x="18.0" y="364.0" font-size="10.5" fill="#5a6b7b" text-anchor="start">（若按链路条数数，则是 1 条和 5 条；两种数法的结论一致。）</text>
</svg>
