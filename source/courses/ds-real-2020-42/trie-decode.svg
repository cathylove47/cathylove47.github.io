<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 512" width="560" height="512" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="2020 年第 42 题：字典树与译码过程">
  <title>2020 年第 42 题：字典树与译码过程</title>
  <desc>三叶字典树与 01011 的逐位译码过程，输出 ABC。</desc>
  <rect width="560" height="512" fill="#f5f8fc"/>
  <text x="16" y="26" font-size="15" font-weight="bold" fill="#1f2d3d">2020 年第 42 题：字典树与译码过程</text>
  <text x="18.0" y="50.0" font-size="11" fill="#5a6b7b" text-anchor="start">字典树（Trie）：字符只放在叶结点，根到叶的路径就是该字符的编码（讲解用例）</text>
  <circle cx="240.0" cy="92.0" r="18" fill="#eef3fb" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="240.0" y="95.6" font-size="10" fill="#1f2d3d" text-anchor="middle" font-weight="bold">根</text>
  <line x1="240.0" y1="92.0" x2="120.0" y2="182.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <text x="172.0" y="141.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">0</text>
  <line x1="240.0" y1="92.0" x2="240.0" y2="182.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <text x="250.0" y="141.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">1</text>
  <line x1="240.0" y1="182.0" x2="170.0" y2="282.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <text x="195.0" y="236.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">0</text>
  <line x1="240.0" y1="182.0" x2="310.0" y2="282.0" stroke="#7f8f9f" stroke-width="2" stroke-linecap="round"/>
  <text x="285.0" y="236.0" font-size="11" fill="#2f6fed" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="120.0" cy="182.0" r="18" fill="#dbe6f7" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="120.0" y="186.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">A</text>
  <circle cx="240.0" cy="182.0" r="18" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="240.0" y="185.2" font-size="9" fill="#1f2d3d" text-anchor="middle" font-weight="bold">内</text>
  <circle cx="170.0" cy="282.0" r="18" fill="#dbe6f7" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="170.0" y="286.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">B</text>
  <circle cx="310.0" cy="282.0" r="18" fill="#dbe6f7" stroke="#1f2d3d" stroke-width="1.8"/>
  <text x="310.0" y="286.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">C</text>
  <text x="240.0" y="330.0" font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">叶结点即编码终点：A = 0，B = 10，C = 11</text>
  <text x="18.0" y="372.0" font-size="11.5" fill="#1f2d3d" text-anchor="start" font-weight="bold">译码 01011：从根出发逐位下行，一旦落在字符结点就输出并回到根</text>
  <text x="24.0" y="400.0" font-size="12" fill="#2f6fed" text-anchor="start" font-weight="bold">0</text>
  <text x="110.0" y="400.0" font-size="11" fill="#1f2d3d" text-anchor="start">根 → 0 → A</text>
  <text x="350.0" y="400.0" font-size="11" fill="#1f8a5f" text-anchor="start">输出 A，回根</text>
  <text x="24.0" y="424.0" font-size="12" fill="#2f6fed" text-anchor="start" font-weight="bold">1 0</text>
  <text x="110.0" y="424.0" font-size="11" fill="#1f2d3d" text-anchor="start">根 → 1 → 内 → 0 → B</text>
  <text x="350.0" y="424.0" font-size="11" fill="#1f8a5f" text-anchor="start">输出 B，回根</text>
  <text x="24.0" y="448.0" font-size="12" fill="#2f6fed" text-anchor="start" font-weight="bold">1 1</text>
  <text x="110.0" y="448.0" font-size="11" fill="#1f2d3d" text-anchor="start">根 → 1 → 内 → 1 → C</text>
  <text x="350.0" y="448.0" font-size="11" fill="#1f8a5f" text-anchor="start">输出 C，回根</text>
  <text x="18.0" y="494.0" font-size="10.5" fill="#5a6b7b" text-anchor="start">译码结果 ABC；每读一位走一条边，总代价 O(码长)。</text>
</svg>
