<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">相等关键字的处置决定稳定性</title>
  <desc id="dsc">原程序用严格小于比较：25 与 25 相等时走 else 分支让 count[0] 加一，于是 b[4] 来自 a[2]、b[5] 来自 a[0]，两个 25 交换次序，不稳定。把条件改成小于等于后，count[2] 加一，b[4] 来自 a[0]、b[5] 来自 a[2]，次序保持，算法稳定。</desc>
  <rect width="960" height="330" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2021 · 第 42 题：只改一个不等号，就决定两个 25 的先后</text>
    <text x="24" y="52" font-size="12" fill="#5b6b7a">思路：稳定排序要求“关键字相等的元素保持原有相对次序”。原程序把“相等”归入了“a[i] 更大”的分支，等于主动打乱它。</text>

    <!-- table header -->
    <g fill="#5b6b7a" font-size="12">
      <text x="44" y="86">a[0] 与 a[2] 的比较</text>
      <text x="288" y="86">落入哪个分支</text>
      <text x="500" y="86">count[0]</text>
      <text x="580" y="86">count[2]</text>
      <text x="648" y="86">b[4]</text>
      <text x="748" y="86">b[5]</text>
      <text x="848" y="86">结果</text>
    </g>
    <line x1="40" y1="94" x2="930" y2="94" stroke="#8a9aa8"/>

    <!-- row 1 -->
    <rect x="40" y="102" width="890" height="58" fill="#fdf1f2"/>
    <text x="44" y="126" font-size="13">25 &lt; 25 为假</text>
    <text x="44" y="146" font-size="11" fill="#5b6b7a">（原程序 if (a[i] &lt; a[j])）</text>
    <text x="288" y="136" font-size="13">else 分支：count[0]++</text>
    <text x="524" y="136" font-size="15" font-weight="bold" text-anchor="middle">5</text>
    <text x="604" y="136" font-size="15" font-weight="bold" text-anchor="middle">4</text>
    <text x="672" y="136" font-size="13">a[2] = 25</text>
    <text x="772" y="136" font-size="13">a[0] = 25</text>
    <text x="872" y="136" font-size="13" font-weight="bold" fill="#b23a48">不稳定</text>

    <!-- row 2 -->
    <rect x="40" y="166" width="890" height="58" fill="#eef7f1"/>
    <text x="44" y="190" font-size="13">25 &lt;= 25 为真</text>
    <text x="44" y="210" font-size="11" fill="#5b6b7a">（改成 if (a[i] &lt;= a[j])）</text>
    <text x="288" y="200" font-size="13">then 分支：count[2]++</text>
    <text x="524" y="200" font-size="15" font-weight="bold" text-anchor="middle">4</text>
    <text x="604" y="200" font-size="15" font-weight="bold" text-anchor="middle">5</text>
    <text x="672" y="200" font-size="13">a[0] = 25</text>
    <text x="772" y="200" font-size="13">a[2] = 25</text>
    <text x="872" y="200" font-size="13" font-weight="bold" fill="#1e7a4f">稳定</text>

    <!-- sequence strip -->
    <text x="24" y="252" font-size="12" fill="#5b6b7a">原始相对次序</text>
    <rect x="140" y="236" width="66" height="26" fill="#fbe4e6" stroke="#8a2f3b"/>
    <text x="173" y="254" font-size="12" text-anchor="middle">25@0</text>
    <text x="216" y="254" font-size="12">在</text>
    <rect x="236" y="236" width="66" height="26" fill="#fbe4e6" stroke="#8a2f3b"/>
    <text x="269" y="254" font-size="12" text-anchor="middle">25@2</text>
    <text x="316" y="254" font-size="12">之前</text>

    <text x="420" y="252" font-size="12" fill="#5b6b7a">原程序输出次序</text>
    <rect x="536" y="236" width="66" height="26" fill="#ffffff" stroke="#b23a48"/>
    <text x="569" y="254" font-size="12" text-anchor="middle">25@2</text>
    <text x="612" y="254" font-size="12">在</text>
    <rect x="632" y="236" width="66" height="26" fill="#ffffff" stroke="#b23a48"/>
    <text x="665" y="254" font-size="12" text-anchor="middle">25@0</text>
    <text x="712" y="254" font-size="12" fill="#b23a48">之前 —— 次序被交换</text>

    <text x="24" y="296" font-size="12" fill="#5b6b7a">把条件改成“小于等于”后，相等的关键字按“先出现者排在前”计数，count[i] 恰是稳定的位次，比较次数仍为 n(n−1)/2。</text>
    <text x="24" y="316" font-size="12" fill="#5b6b7a">也可以不改比较条件，改为“从后往前”枚举下标对，但那样要重新推导计数语义，代价比改一个符号大。</text>
  </g>
</svg>
