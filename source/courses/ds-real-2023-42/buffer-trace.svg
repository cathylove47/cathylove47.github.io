    <text x="24" y="30" font-size="15" font-weight="bold">2023 · 第 42 题：置换-选择排序的逐步执行</text>

    <text x="24" y="56" font-size="12" fill="#5b6b7a">每列：上格是本步输出的记录，下面 4 格是本步读入新记录之后的整个工作区；灰色槽位已冻结，本段不能再选。</text>
    <text x="24" y="76" font-size="12" fill="#5b6b7a">选择规则：在本段未冻结的记录中，取“关键字不小于刚输出记录”的最小者；没有可选记录就换段并全部解冻。</text>
