    <text x="24" y="72" font-size="12" fill="#5b6b7a">输入文件（19 个记录，按此先后次序读入）：51, 94, 37, 92, 14, 63, 15, 99, 48, 56, 23, 60, 31, 17, 43, 8, 90, 166, 100</text>
