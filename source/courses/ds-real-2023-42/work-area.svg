    <g font-size="15" text-anchor="middle">
      <text x="264" y="303">51</text><text x="360" y="303">94</text>
      <text x="456" y="303">37</text><text x="552" y="303">92</text>
    </g>
    <text x="620" y="303" font-size="12" fill="#5b6b7a">先装满 4 个记录</text>

    <text x="24" y="356" font-size="12" fill="#5b6b7a">每输出一个记录，就从输入文件读入下一个记录补进空位；关键字比“刚输出的记录”还小的记录被冻结，</text>
    <text x="24" y="378" font-size="12" fill="#5b6b7a">本轮不能再输出，要等到下一个归并段才解冻。工作区里已没有比最后输出更大的记录时，当前归并段结束。</text>
  </g>
</svg>
