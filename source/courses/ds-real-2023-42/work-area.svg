"10" fill="#5b6b7a" text-anchor="middle">第9个</text><rect x="696" y="100" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="731" y="127" font-size="14" text-anchor="middle">48</text><text x="813" y="92" font-size="10" fill="#5b6b7a" text-anchor="middle">第10个</text><rect x="778" y="100" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="813" y="127" font-size="14" text-anchor="middle">56</text><text x="75" y="172" font-size="10" fill="#5b6b7a" text-anchor="middle">第11个</text><rect x="40" y="180" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="75" y="207" font-size="14" text-anchor="middle">23</text><text x="157" y="172" font-size="10" fill="#5b6b7a" text-anchor="middle">第12个</text><rect x="122" y="180" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="157" y="207" font-size="14" text-anchor="middle">60</text><text x="239" y="172" font-size="10" fill="#5b6b7a" text-anchor="middle">第13个</text><rect x="204" y="180" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="239" y="207" font-size="14" text-anchor="middle">31</text><text x="321" y="172" font-size="10" fill="#5b6b7a" text-anchor="middle">第14个</text><rect x="286" y="180" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="321" y="207" font-size="14" text-anchor="middle">17</text><text x="403" y="172" font-size="10" fill="#5b6b7a" text-anchor="middle">第15个</text><rect x="368" y="180" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="403" y="207" font-size="14" text-anchor="middle">43</text><text x="485" y="172" font-size="10" fill="#5b6b7a" text-anchor="middle">第16个</text><rect x="450" y="180" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="485" y="207" font-size="14" text-anchor="middle">8</text><text x="567" y="172" font-size="10" fill="#5b6b7a" text-anchor="middle">第17个</text><rect x="532" y="180" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="567" y="207" font-size="14" text-anchor="middle">90</text><text x="649" y="172" font-size="10" fill="#5b6b7a" text-anchor="middle">第18个</text><rect x="614" y="180" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="649" y="207" font-size="14" text-anchor="middle">166</text><text x="731" y="172" font-size="10" fill="#5b6b7a" text-anchor="middle">第19个</text><rect x="696" y="180" width="70" height="42" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="731" y="207" font-size="14" text-anchor="middle">100</text>

    <!-- work area -->
    <text x="40" y="300" font-size="13" font-weight="bold">工作区（容量 m = 4）</text>
    <g>
      <rect x="220" y="276" width="88" height="42" fill="#e8f1f8" stroke="#356c91" stroke-width="1.6"/>
      <rect x="316" y="276" width="88" height="42" fill="#e8f1f8" stroke="#356c91" stroke-width="1.6"/>
