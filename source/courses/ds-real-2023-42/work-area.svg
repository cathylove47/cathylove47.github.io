<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">2023 · 第 42 题：19 个记录与容量 m = 4 的工作区</title>
  <desc id="dsc">文件中的 19 个记录按给定次序输入，工作区一次只能保存 4 个记录，初始先读入前 4 个。</desc>
  <rect width="900" height="400" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
