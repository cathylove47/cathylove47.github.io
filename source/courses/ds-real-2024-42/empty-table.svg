<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">2024 · 第 42 题：长度为 11 的空散列表与二次探查规则</title>
  <desc id="dsc">散列表 HT 有 11 个槽 0 到 10。H(key) = (key×3) mod 11，第 k 次冲突时探测 H_k = (H_0 + k²) mod 11。关键字按 20、3、11、18、9、14、7 的次序依次插入。</desc>
  <rect width="960" height="330" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2024 · 第 42 题：长度为 11 的空散列表与二次探查规则</text>

    <text x="24" y="60" font-size="13">插入次序：20 → 3 → 11 → 18 → 9 → 14 → 7（共 7 个关键字）</text>
    <text x="24" y="84" font-size="13">H(key) = (key × 3) mod 11　　　H_k = (H_0 + k²) mod 11，k = 0 表示初始地址</text>
    <text x="24" y="110" font-size="12" fill="#5b6b7a">二次探查使用平方数增量 1、4、9、16、…，用 mod 11 折回表头；不是“依次看下一个槽”。</text>
    <text x="24" y="134" font-size="12" fill="#5b6b7a">散列地址</text>
    <text x="78" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">0</text><rect x="44" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="78" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="158" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">1</text><rect x="124" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="158" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="238" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">2</text><rect x="204" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="238" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="318" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">3</text><rect x="284" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="318" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="398" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">4</text><rect x="364" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="398" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="478" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">5</text><rect x="444" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="478" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="558" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">6</text><rect x="524" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="558" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="638" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">7</text><rect x="604" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="638" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="718" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">8</text><rect x="684" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="718" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="798" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">9</text><rect x="764" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="798" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text><text x="878" y="150" font-size="12" fill="#5b6b7a" text-anchor="middle">10</text><rect x="844" y="160" width="68" height="46" fill="#ffffff" stroke="#356c91" stroke-width="1.4"/><text x="878" y="189" font-size="13" fill="#9fadb9" text-anchor="middle">空</text>
    <text x="24" y="248" font-size="12" fill="#5b6b7a">装填因子 α = 表中已存关键字个数 / 表长 = （待求） / 11。</text>
    <text x="24" y="272" font-size="12" fill="#5b6b7a">插入后每个关键字都可能被后来的关键字“挤”到后面的探测地址上，所以必须按给定次序逐个插入。</text>
    <text x="24" y="296" font-size="12" fill="#5b6b7a">注意：冲突次数的统计只算“与已存关键字比较”的次数，第 1 次比较落在 H_0。</text>
  </g>
</svg>
