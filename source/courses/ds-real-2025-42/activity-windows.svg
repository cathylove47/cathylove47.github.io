<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">各活动的最早开始—最晚结束时间窗与时间余量</title>
  <desc id="dsc">时间轴 0 到 12。关键活动 a、e、m、n 的最早开始等于最晚开始，余量为 0；b 的窗口是 0 到 10、d 是 0 到 5、c 是 2 到 8，都能与 e 的 2 到 5 重叠；j 的窗口是 5 到 12，余量 6 最大。顶点 ve 为 0、9、2、5、12、6、9，vl 为 0、10、2、5、12、8、9。</desc>
  <rect width="980" height="600" fill="#ffffff"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2025 · 第 42 题：活动时间窗 [ve(起点), vl(终点)] 与时间余量</text>
    <text x="24" y="50" font-size="12" fill="#5b6b7a">浅色条 = 该活动可以挪动的全部范围；深色块 = 按最早开始时间排出的执行段；右侧数字 = 时间余量 l − e。</text>

    <!-- grid -->
    <g stroke="#dbe3ea" stroke-width="1">
      <line x1="140" y1="72" x2="140" y2="452"/>
      <line x1="256" y1="72" x2="256" y2="452"/>
      <line x1="372" y1="72" x2="372" y2="452"/>
      <line x1="488" y1="72" x2="488" y2="452"/>
      <line x1="604" y1="72" x2="604" y2="452"/>
      <line x1="720" y1="72" x2="720" y2="452"/>
      <line x1="836" y1="72" x2="836" y2="452"/>
    </g>
    <line x1="140" y1="72" x2="836" y2="72" stroke="#8a9aa8"/>
    <g font-size="12" fill="#5b6b7a" text-anchor="middle">
      <text x="140" y="66">0</text><text x="256" y="66">2</text><text x="372" y="66">4</text>
      <text x="488" y="66">6</text><text x="604" y="66">8</text><text x="720" y="66">10</text>
      <text x="836" y="66">12</text>
    </g>

    <!-- e window highlight -->
    <rect x="256" y="74" width="174" height="380" fill="#fdf3e3" opacity="0.85"/>
    <text x="343" y="88" font-size="11" fill="#8a5a12" text-anchor="middle">活动 e 的固定执行区间 [2, 5]</text>

    <!-- rows: activity, source->target, w, ES, LF, slack -->
    <!-- y = 104 + k*29 -->
    <g font-size="12">
      <!-- a -->
      <text x="132" y="108" text-anchor="end">a 1→3 w=2</text>
      <rect x="140" y="96" width="116" height="14" fill="#f1c9cd"/>
      <rect x="140" y="96" width="116" height="14" fill="#b23a48"/>
      <text x="846" y="108" fill="#b23a48" font-weight="bold">0 关键</text>
      <!-- b -->
      <text x="132" y="137" text-anchor="end">b 1→2 w=5</text>
      <rect x="140" y="125" width="580" height="14" fill="#eef3f7"/>
      <rect x="140" y="125" width="290" height="14" fill="#356c91"/>
      <text x="846" y="137" fill="#5b6b7a">5</text>
      <!-- c -->
      <text x="132" y="166" text-anchor="end">c 3→6 w=1</text>
      <rect x="256" y="154" width="348" height="14" fill="#eef3f7"/>
      <rect x="256" y="154" width="58" height="14" fill="#356c91"/>
      <text x="846" y="166" fill="#5b6b7a">5</text>
      <!-- d -->
      <text x="132" y="195" text-anchor="end">d 1→4 w=3</text>
      <rect x="140" y="183" width="290" height="14" fill="#eef3f7"/>
      <rect x="140" y="183" width="174" height="14" fill="#356c91"/>
      <text x="846" y="195" fill="#5b6b7a">2</text>
      <!-- e -->
      <text x="132" y="224" text-anchor="end">e 3→4 w=3</text>
      <rect x="256" y="212" width="174" height="14" fill="#b23a48"/>
      <text x="846" y="224" fill="#b23a48" font-weight="bold">0 关键</text>
      <!-- f -->
      <text x="132" y="253" text-anchor="end">f 4→2 w=4</text>
      <rect x="430" y="241" width="290" height="14" fill="#eef3f7"/>
      <rect x="430" y="241" width="232" height="14" fill="#356c91"/>
      <text x="846" y="253" fill="#5b6b7a">1</text>
      <!-- g -->
      <text x="132" y="282" text-anchor="end">g 4→6 w=1</text>
      <rect x="430" y="270" width="174" height="14" fill="#eef3f7"/>
      <rect x="430" y="270" width="58" height="14" fill="#356c91"/>
      <text x="846" y="282" fill="#5b6b7a">2</text>
      <!-- h -->
      <text x="132" y="311" text-anchor="end">h 6→7 w=1</text>
      <rect x="488" y="299" width="174" height="14" fill="#eef3f7"/>
      <rect x="488" y="299" width="58" height="14" fill="#356c91"/>
      <text x="846" y="311" fill="#5b6b7a">2</text>
      <!-- j -->
      <text x="132" y="340" text-anchor="end">j 4→5 w=1</text>
      <rect x="430" y="328" width="406" height="14" fill="#dff0e7"/>
      <rect x="430" y="328" width="58" height="14" fill="#1e7a4f"/>
      <text x="846" y="340" fill="#1e7a4f" font-weight="bold">6 最大</text>
      <!-- k -->
      <text x="132" y="369" text-anchor="end">k 2→5 w=2</text>
      <rect x="662" y="357" width="174" height="14" fill="#eef3f7"/>
      <rect x="662" y="357" width="116" height="14" fill="#356c91"/>
      <text x="846" y="369" fill="#5b6b7a">1</text>
      <!-- m -->
      <text x="132" y="398" text-anchor="end">m 4→7 w=4</text>
      <rect x="430" y="386" width="232" height="14" fill="#b23a48"/>
      <text x="846" y="398" fill="#b23a48" font-weight="bold">0 关键</text>
      <!-- n -->
      <text x="132" y="427" text-anchor="end">n 7→5 w=3</text>
      <rect x="662" y="415" width="174" height="14" fill="#b23a48"/>
      <text x="846" y="427" fill="#b23a48" font-weight="bold">0 关键</text>
    </g>

    <!-- node table -->
    <g font-size="13">
      <text x="24" y="486" font-weight="bold">顶点最早 / 最晚发生时间</text>
      <g fill="#5b6b7a" font-size="12" text-anchor="middle">
        <text x="150" y="512">1</text><text x="230" y="512">2</text><text x="310" y="512">3</text>
        <text x="390" y="512">4</text><text x="470" y="512">5</text><text x="550" y="512">6</text>
        <text x="630" y="512">7</text>
      </g>
      <g text-anchor="middle">
        <text x="110" y="536" fill="#5b6b7a" font-size="12">ve</text>
        <text x="110" y="560" fill="#5b6b7a" font-size="12">vl</text>
      </g>
      <g text-anchor="middle" font-size="13">
        <text x="150" y="536">0</text><text x="230" y="536">9</text><text x="310" y="536">2</text>
        <text x="390" y="536">5</text><text x="470" y="536">12</text><text x="550" y="536">6</text>
        <text x="630" y="536">9</text>
        <text x="150" y="560">0</text><text x="230" y="560" fill="#1e7a4f" font-weight="bold">10</text>
        <text x="310" y="560">2</text><text x="390" y="560">5</text><text x="470" y="560">12</text>
        <text x="550" y="560" fill="#1e7a4f" font-weight="bold">8</text><text x="630" y="560">9</text>
      </g>
      <text x="680" y="536" font-size="12" fill="#5b6b7a">ve = vl 的顶点：1、3、4、5、7</text>
      <text x="680" y="558" font-size="12" fill="#5b6b7a">关键路径 1→3→4→7→5 = 2+3+4+3 = 12</text>
    </g>
  </g>
</svg>
