<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">2026 · 第 42 题：按首元素统计出栈序列数（卡特兰数）</title>
  <desc id="dsc">n 从 1 到 6 的出栈序列总数依次为 1、2、5、14、42、132；以 1 开头和以 2 开头的个数都等于 C(n-1)。n=4 且以 2 开头的 5 个序列为 2,1,3,4；2,1,4,3；2,3,1,4；2,3,4,1；2,4,3,1。</desc>
  <rect width="980" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#356c91"/>
    </marker>
  </defs>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2026 · 第 42 题：按首元素统计出栈序列数（卡特兰数）</text>

    <text x="40" y="92" font-size="12" fill="#5b6b7a">n</text><text x="150" y="92" font-size="12" fill="#5b6b7a">序列总数</text><text x="240" y="92" font-size="12" fill="#5b6b7a">以 1 开头</text><text x="328" y="92" font-size="12" fill="#5b6b7a">以 2 开头</text><text x="416" y="92" font-size="12" fill="#5b6b7a">以 3 开头</text><text x="504" y="92" font-size="12" fill="#5b6b7a">以 4 开头</text><text x="592" y="92" font-size="12" fill="#5b6b7a">以 5 开头</text><text x="680" y="92" font-size="12" fill="#5b6b7a">以 6 开头</text><line x1="40" y1="106" x2="900" y2="106" stroke="#9fadb9"/><text x="40" y="132" font-size="13">1</text><text x="160" y="132" font-size="13" font-weight="bold">1</text><text x="240" y="132" font-size="13" fill="#132c40" font-weight="normal">1</text><text x="328" y="132" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="416" y="132" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="504" y="132" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="592" y="132" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="680" y="132" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="40" y="162" font-size="13">2</text><text x="160" y="162" font-size="13" font-weight="bold">2</text><text x="240" y="162" font-size="13" fill="#132c40" font-weight="normal">1</text><text x="328" y="162" font-size="13" fill="#132c40" font-weight="normal">1</text><text x="416" y="162" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="504" y="162" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="592" y="162" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="680" y="162" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="40" y="192" font-size="13">3</text><text x="160" y="192" font-size="13" font-weight="bold">5</text><text x="240" y="192" font-size="13" fill="#132c40" font-weight="normal">2</text><text x="328" y="192" font-size="13" fill="#132c40" font-weight="normal">2</text><text x="416" y="192" font-size="13" fill="#132c40" font-weight="normal">1</text><text x="504" y="192" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="592" y="192" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="680" y="192" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="40" y="222" font-size="13">4</text><text x="160" y="222" font-size="13" font-weight="bold">14</text><text x="240" y="222" font-size="13" fill="#132c40" font-weight="normal">5</text><text x="328" y="222" font-size="13" fill="#b23a48" font-weight="bold">5</text><text x="416" y="222" font-size="13" fill="#132c40" font-weight="normal">3</text><text x="504" y="222" font-size="13" fill="#132c40" font-weight="normal">1</text><text x="592" y="222" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="680" y="222" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="40" y="252" font-size="13">5</text><text x="160" y="252" font-size="13" font-weight="bold">42</text><text x="240" y="252" font-size="13" fill="#132c40" font-weight="normal">14</text><text x="328" y="252" font-size="13" fill="#132c40" font-weight="normal">14</text><text x="416" y="252" font-size="13" fill="#132c40" font-weight="normal">9</text><text x="504" y="252" font-size="13" fill="#132c40" font-weight="normal">4</text><text x="592" y="252" font-size="13" fill="#132c40" font-weight="normal">1</text><text x="680" y="252" font-size="13" fill="#132c40" font-weight="normal">—</text><text x="40" y="282" font-size="13">6</text><text x="160" y="282" font-size="13" font-weight="bold">132</text><text x="240" y="282" font-size="13" fill="#132c40" font-weight="normal">42</text><text x="328" y="282" font-size="13" fill="#132c40" font-weight="normal">42</text><text x="416" y="282" font-size="13" fill="#132c40" font-weight="normal">28</text><text x="504" y="282" font-size="13" fill="#132c40" font-weight="normal">14</text><text x="592" y="282" font-size="13" fill="#132c40" font-weight="normal">5</text><text x="680" y="282" font-size="13" fill="#132c40" font-weight="normal">1</text><line x1="40" y1="294" x2="900" y2="294" stroke="#9fadb9"/><text x="40" y="334" font-size="13" font-weight="bold" fill="#b23a48">n = 4 且以 2 开头的全部序列（共 5 个）：</text><rect x="40" y="346" width="130" height="34" fill="#fbe4e6" stroke="#b23a48" stroke-width="1.2"/><text x="105" y="369" font-size="13" text-anchor="middle">2,1,3,4</text><rect x="190" y="346" width="130" height="34" fill="#fbe4e6" stroke="#b23a48" stroke-width="1.2"/><text x="255" y="369" font-size="13" text-anchor="middle">2,1,4,3</text><rect x="340" y="346" width="130" height="34" fill="#fbe4e6" stroke="#b23a48" stroke-width="1.2"/><text x="405" y="369" font-size="13" text-anchor="middle">2,3,1,4</text><rect x="490" y="346" width="130" height="34" fill="#fbe4e6" stroke="#b23a48" stroke-width="1.2"/><text x="555" y="369" font-size="13" text-anchor="middle">2,3,4,1</text><rect x="640" y="346" width="130" height="34" fill="#fbe4e6" stroke="#b23a48" stroke-width="1.2"/><text x="705" y="369" font-size="13" text-anchor="middle">2,4,3,1</text><text x="40" y="410" font-size="12" fill="#5b6b7a">规律：以 1 开头、以 2 开头的序列数都等于 C₍ₙ₋₁₎；n = 5 时都是 14 个，n = 6 时都是 42 个，与上表完全吻合。</text><text x="40" y="436" font-size="13" fill="#1e7a4f">因此 n = k 时：以 1 开头 M 个，以 2 开头 M 个，总数 Cₖ = M × 2(2k−1)/(k+1)。</text><text x="40" y="462" font-size="12" fill="#5b6b7a">验算：k = 4 时 M = C₃ = 5，C₄ = 5 × 2·7/5 = 14 ✓；k = 6 时 M = C₅ = 42，C₆ = 42 × 2·11/7 = 132 ✓。</text><text x="40" y="488" font-size="12" fill="#5b6b7a">“以 2 开头”为什么也是 M：压 1、压 2、弹 2 之后，1 留在栈底，3…k 的入栈出栈与规模 k−1 的情形一一对应。</text>
  </g>
</svg>
