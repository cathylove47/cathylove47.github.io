<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">2026 · 第 42 题：1,2,…,n 依次入栈，出栈次序有几种可能</title>
  <desc id="dsc">入栈次序固定为 1、2、…、n，任何时刻都可以选择入栈或出栈；问哪些排列能作为出栈序列，以及各有多少个。</desc>
  <rect width="980" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#356c91"/>
    </marker>
  </defs>
  <g font-family="Arial, Microsoft YaHei, sans-serif" fill="#132c40">
    <text x="24" y="30" font-size="15" font-weight="bold">2026 · 第 42 题：1,2,…,n 依次入栈，出栈次序有几种可能</text>

    <text x="44" y="78" font-size="12" fill="#5b6b7a">入栈次序（固定，不能跳号）：1 → 2 → 3 → … → 9</text>
    <rect x="44" y="96" width="40" height="32" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="64" y="118" font-size="13" text-anchor="middle">1</text><rect x="90" y="96" width="40" height="32" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="110" y="118" font-size="13" text-anchor="middle">2</text><rect x="136" y="96" width="40" height="32" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="156" y="118" font-size="13" text-anchor="middle">3</text><rect x="182" y="96" width="40" height="32" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="202" y="118" font-size="13" text-anchor="middle">4</text><rect x="228" y="96" width="40" height="32" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="248" y="118" font-size="13" text-anchor="middle">5</text><rect x="274" y="96" width="40" height="32" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="294" y="118" font-size="13" text-anchor="middle">6</text><rect x="320" y="96" width="40" height="32" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="340" y="118" font-size="13" text-anchor="middle">7</text><rect x="366" y="96" width="40" height="32" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="386" y="118" font-size="13" text-anchor="middle">8</text><rect x="412" y="96" width="40" height="32" fill="#e8f1f8" stroke="#356c91" stroke-width="1.4"/><text x="432" y="118" font-size="13" text-anchor="middle">9</text>

    <!-- stack -->
    <path d="M 170 178 L 170 330 M 262 178 L 262 330 M 170 330 L 262 330" stroke="#356c91" stroke-width="2" fill="none"/>
    <g stroke="#356c91" stroke-width="1" opacity="0.45">
      <line x1="170" y1="292" x2="262" y2="292"/>
      <line x1="170" y1="254" x2="262" y2="254"/>
      <line x1="170" y1="216" x2="262" y2="216"/>
    </g>
    <text x="216" y="352" font-size="12" fill="#5b6b7a" text-anchor="middle">栈：后进先出，只能从栈顶取</text>

    <!-- push arrow -->
    <path d="M 180 130 C 180 150, 196 158, 208 174" stroke="#356c91" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <text x="118" y="168" font-size="12" fill="#356c91">入栈</text>

    <!-- pop arrow -->
    <path d="M 266 286 C 360 282, 450 262, 552 254" stroke="#356c91" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <text x="360" y="272" font-size="12" fill="#356c91">出栈</text>

    <text x="560" y="220" font-size="12" fill="#5b6b7a">出栈序列 P₁ P₂ … P₉（顺序可任意，但要能由一次栈运行实现）</text>
    <rect x="560" y="236" width="38" height="32" fill="#ffffff" stroke="#9fadb9" stroke-dasharray="4 3"/><text x="579" y="258" font-size="13" fill="#9fadb9" text-anchor="middle">?</text><rect x="602" y="236" width="38" height="32" fill="#ffffff" stroke="#9fadb9" stroke-dasharray="4 3"/><text x="621" y="258" font-size="13" fill="#9fadb9" text-anchor="middle">?</text><rect x="644" y="236" width="38" height="32" fill="#ffffff" stroke="#9fadb9" stroke-dasharray="4 3"/><text x="663" y="258" font-size="13" fill="#9fadb9" text-anchor="middle">?</text><rect x="686" y="236" width="38" height="32" fill="#ffffff" stroke="#9fadb9" stroke-dasharray="4 3"/><text x="705" y="258" font-size="13" fill="#9fadb9" text-anchor="middle">?</text><rect x="728" y="236" width="38" height="32" fill="#ffffff" stroke="#9fadb9" stroke-dasharray="4 3"/><text x="747" y="258" font-size="13" fill="#9fadb9" text-anchor="middle">?</text><rect x="770" y="236" width="38" height="32" fill="#ffffff" stroke="#9fadb9" stroke-dasharray="4 3"/><text x="789" y="258" font-size="13" fill="#9fadb9" text-anchor="middle">?</text><rect x="812" y="236" width="38" height="32" fill="#ffffff" stroke="#9fadb9" stroke-dasharray="4 3"/><text x="831" y="258" font-size="13" fill="#9fadb9" text-anchor="middle">?</text><rect x="854" y="236" width="38" height="32" fill="#ffffff" stroke="#9fadb9" stroke-dasharray="4 3"/><text x="873" y="258" font-size="13" fill="#9fadb9" text-anchor="middle">?</text><rect x="896" y="236" width="38" height="32" fill="#ffffff" stroke="#9fadb9" stroke-dasharray="4 3"/><text x="915" y="258" font-size="13" fill="#9fadb9" text-anchor="middle">?</text>
    <text x="560" y="300" font-size="12" fill="#5b6b7a">问：哪些排列可以？以 2 开头的 n = 4 序列有几个？n 与总数是什么关系？</text>

    <text x="44" y="384" font-size="12" fill="#5b6b7a">关键约束：某元素一旦被压在栈里，比它晚入栈的元素必须先出栈，之后才能轮到它。</text>
  </g>
</svg>
