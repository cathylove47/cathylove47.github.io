<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img"><title>单车道桥 PV 模型</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356c91"/></marker>
<marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b8473a"/></marker></defs>
<rect width="880" height="350" fill="#ffffff"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#132c40" font-size="14">
<text x="24.0" y="34.0" font-size="17" fill="#132c40" text-anchor="start" font-weight="bold">单车道桥：同向可连续上桥，异向互斥，桥上最多 k 辆</text><rect x="40" y="70" width="80" height="150" fill="#d9e6ef"/><rect x="760" y="70" width="80" height="150" fill="#d9e6ef"/><text x="80.0" y="240.0" font-size="14" fill="#6b7c89" text-anchor="middle">北岸</text><text x="800.0" y="240.0" font-size="14" fill="#6b7c89" text-anchor="middle">南岸</text><path d="M120 150 Q440 110 760 150" fill="none" stroke="#132c40" stroke-width="6"/><path d="M120 172 Q440 132 760 172" fill="none" stroke="#132c40" stroke-width="2"/><rect x="300" y="108" width="44" height="20" rx="5" fill="#356c91"/><rect x="380" y="108" width="44" height="20" rx="5" fill="#356c91"/><rect x="460" y="108" width="44" height="20" rx="5" fill="#356c91"/><line x1="300.0" y1="96.0" x2="520.0" y2="96.0" stroke="#356c91" stroke-width="1.8" marker-end="url(#arrow)"/><text x="410.0" y="88.0" font-size="13" fill="#356c91" text-anchor="middle">同向车流：cntN 辆在桥上</text><rect x="770" y="126" width="44" height="20" rx="5" fill="#b8473a"/><line x1="760.0" y1="118.0" x2="700.0" y2="118.0" stroke="#b8473a" stroke-width="1.8" marker-end="url(#arrowR)"/><text x="694.0" y="122.0" font-size="13" fill="#b8473a" text-anchor="end">对向车在 P(bridge) 等待</text><rect x="130" y="262" width="190" height="64" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="225.0" y="289.6" font-size="13" fill="#132c40" text-anchor="middle">bridge = 1</text><text x="225.0" y="307.6" font-size="13" fill="#132c40" text-anchor="middle">方向锁：首辆申请，末辆释放</text><rect x="345" y="262" width="190" height="64" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="440.0" y="289.6" font-size="13" fill="#132c40" text-anchor="middle">cap = k</text><text x="440.0" y="307.6" font-size="13" fill="#132c40" text-anchor="middle">桥上空位：每辆车各 P/V</text><rect x="560" y="262" width="190" height="64" rx="8" fill="#e8f0f6" stroke="#356c91" stroke-width="1.5"/><text x="655.0" y="289.6" font-size="13" fill="#132c40" text-anchor="middle">mutexN / mutexS = 1</text><text x="655.0" y="307.6" font-size="13" fill="#132c40" text-anchor="middle">保护 cntN / cntS</text>
</g></svg>