<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc"><title id="title">两种策略的并查集最终森林</title><desc id="desc">上半图U1根8高度4；下半图U2根8，3仍指向4。双亲箭头指向父结点。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#356c91"/></marker></defs><rect width="360" height="650" fill="#ffffff"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#132c40"><text x="16" y="27" fill="#132c40" font-size="16" font-weight="bold">U1：按高度合并，不压缩</text><text x="16" y="49" fill="#132c40" font-size="14" font-weight="normal">双亲箭头向上；根 8，高度 4</text><path d="M65,125 L180,102" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M155,125 L180,102" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M235,125 L180,102" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M310,125 L180,102" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M35,180 L65,156" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M96,180 L65,156" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M155,180 L155,156" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M35,235 L35,211" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="35" cy="250" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="35" y="255" text-anchor="middle" font-size="15" font-weight="bold">1</text><circle cx="35" cy="195" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="35" y="200" text-anchor="middle" font-size="15" font-weight="bold">2</text><circle cx="96" cy="195" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="96" y="200" text-anchor="middle" font-size="15" font-weight="bold">3</text><circle cx="65" cy="140" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="65" y="145" text-anchor="middle" font-size="15" font-weight="bold">4</text><circle cx="155" cy="195" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="155" y="200" text-anchor="middle" font-size="15" font-weight="bold">5</text><circle cx="155" cy="140" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="155" y="145" text-anchor="middle" font-size="15" font-weight="bold">6</text><circle cx="235" cy="140" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="235" y="145" text-anchor="middle" font-size="15" font-weight="bold">7</text><circle cx="180" cy="86" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="180" y="91" text-anchor="middle" font-size="15" font-weight="bold">8</text><circle cx="310" cy="140" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="310" y="145" text-anchor="middle" font-size="15" font-weight="bold">9</text><text x="16" y="288" fill="#132c40" font-size="14" font-weight="normal">最长路径：8 → 4 → 2 → 1（四层）</text><path d="M16 311H344" stroke="#d9e5ed"/><text x="16" y="340" fill="#132c40" font-size="16" font-weight="bold">U2：按大小合并，立即压缩</text><text x="16" y="362" fill="#132c40" font-size="14" font-weight="normal">根 8；只压缩本次 Find 经过的路径</text><path d="M30,454 L180,415" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M80,454 L180,415" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M130,454 L180,415" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M180,454 L180,415" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M230,454 L180,415" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M280,454 L180,415" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M330,454 L180,415" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M130,516 L130,485" fill="none" stroke="#356c91" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="30" cy="469" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="30" y="474" text-anchor="middle" font-size="15" font-weight="bold">1</text><circle cx="80" cy="469" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="80" y="474" text-anchor="middle" font-size="15" font-weight="bold">2</text><circle cx="130" cy="531" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="130" y="536" text-anchor="middle" font-size="15" font-weight="bold">3</text><circle cx="130" cy="469" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="130" y="474" text-anchor="middle" font-size="15" font-weight="bold">4</text><circle cx="180" cy="469" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="180" y="474" text-anchor="middle" font-size="15" font-weight="bold">5</text><circle cx="230" cy="469" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="230" y="474" text-anchor="middle" font-size="15" font-weight="bold">6</text><circle cx="280" cy="469" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="280" y="474" text-anchor="middle" font-size="15" font-weight="bold">7</text><circle cx="180" cy="399" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="180" y="404" text-anchor="middle" font-size="15" font-weight="bold">8</text><circle cx="330" cy="469" r="15" fill="#e6f2ff" stroke="#356c91"/><text x="330" y="474" text-anchor="middle" font-size="15" font-weight="bold">9</text><text x="16" y="573" fill="#132c40" font-size="14" font-weight="normal">3 仍指向 4：Find(1) 没有经过 3。</text><text x="16" y="601" fill="#132c40" font-size="14" font-weight="normal">Find(5)：5 → 6 → 8，返回 8</text><text x="16" y="629" fill="#132c40" font-size="14" font-weight="normal">Find(1)：1 → 2 → 4 → 8，返回 8</text></g></svg>