<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="'Helvetica Neue',Arial,sans-serif">
  <title>Prim：包含零权边的最小生成树</title>
  <desc>示例图用蓝线标出四条最小生成树边，含零权边，总权值为6；归属状态与候选边权分别记录。</desc>
  <rect width="360" height="300" fill="#f5f8fc"/>
  <text x="12" y="21" font-size="13" font-weight="bold" fill="#1f2d3d">例：含 0 权边的连通图 → 最小生成树</text>
  <text x="12" y="38" font-size="10.5" fill="#5a6b7b">MST 选边：0—1(0)、1—2(3)、2—3(1)、3—4(2)，总权值 6</text>

  <!-- non-tree edges -->
  <line x1="34" y1="150" x2="130" y2="195" stroke="#b9c4d0" stroke-width="1.6"/>
  <line x1="130" y1="70" x2="258" y2="70" stroke="#b9c4d0" stroke-width="1.6"/>
  <line x1="130" y1="195" x2="258" y2="205" stroke="#b9c4d0" stroke-width="1.6"/>

  <!-- tree edges -->
  <line x1="34" y1="150" x2="130" y2="70" stroke="#2f6fed" stroke-width="3"/>
  <line x1="130" y1="70" x2="130" y2="195" stroke="#2f6fed" stroke-width="3"/>
  <line x1="130" y1="195" x2="258" y2="70" stroke="#2f6fed" stroke-width="3"/>
  <line x1="258" y1="70" x2="258" y2="205" stroke="#2f6fed" stroke-width="3"/>

  <!-- edge weight labels -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <text x="76" y="106" fill="#2f6fed">0</text>
    <text x="76" y="180" fill="#c0392b">4</text>
    <text x="142" y="136" fill="#2f6fed">3</text>
    <text x="194" y="62" fill="#c0392b">7</text>
    <text x="188" y="138" fill="#2f6fed">1</text>
    <text x="200" y="216" fill="#c0392b">6</text>
    <text x="272" y="142" fill="#2f6fed">2</text>
  </g>

  <!-- vertices -->
  <g fill="#fff" stroke="#1f2d3d" stroke-width="1.6">
    <circle cx="34" cy="150" r="11"/>
    <circle cx="130" cy="70" r="11"/>
    <circle cx="130" cy="195" r="11"/>
    <circle cx="258" cy="70" r="11"/>
    <circle cx="258" cy="205" r="11"/>
  </g>
  <g font-size="11" fill="#1f2d3d" text-anchor="middle" font-weight="bold">
    <text x="34" y="154">0</text>
    <text x="130" y="74">1</text>
    <text x="130" y="199">2</text>
    <text x="258" y="74">3</text>
    <text x="258" y="209">4</text>
  </g>

  <line x1="12" y1="252" x2="46" y2="252" stroke="#2f6fed" stroke-width="3"/>
  <text x="52" y="256" font-size="10.5" fill="#1f2d3d">MST 边</text>
  <line x1="118" y1="252" x2="152" y2="252" stroke="#b9c4d0" stroke-width="1.6"/>
  <text x="158" y="256" font-size="10.5" fill="#1f2d3d">非 MST 边</text>

  <text x="12" y="280" font-size="10.5" fill="#5a6b7b">0 权边 0—1 权值为 0，仍必选入 S：visited 与 lowcost 必须分开记录。</text>
</svg>
