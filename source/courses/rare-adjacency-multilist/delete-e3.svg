<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" width="360" height="800" role="img" aria-labelledby="deTitle deDesc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title id="deTitle">删除边 e3 前后的两条依附链与改动的字段</title>
  <desc id="deDesc">删除前：B 链是 e1 经 e1.jlink 到 e3 再经 e3.ilink 到 NULL；C 链是 e2 经 e2.jlink 到 e3 再经 e3.jlink 到 NULL，e3 同时挂在两条链上。要改的字段只有两个：e1.jlink 与 e2.jlink 都由 e3 改成 NULL，四个顶点的 firstedge 都不变，e3 自己的字段不用改。删除后 B 链只剩 e1 再到 NULL，C 链只剩 e2 再到 NULL，e3 被释放。剩余边结点是 e1、e2，度是 A2、B1、C1、D0，度和为 4。顺序必须是先从两条链上摘干净再释放 e3，否则另一端链上留下悬空指针；找前驱要沿链走，不是拿到 e3 的地址就能 O(1) 删除。</desc>
  <rect x="0" y="0" width="360" height="800" fill="#fffdf7"/>

  <text x="14" y="30" font-size="20" font-weight="700" fill="#1f2937">① 删除前：e3 挂在两条链上</text>

  <text x="16" y="97" font-size="20" font-weight="700" fill="#1e3a8a">B</text>
  <rect x="36" y="71" width="64" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="68" y="97" font-size="18" fill="#854d0e" text-anchor="middle">e1</text>
  <line x1="100" y1="90" x2="148" y2="90" stroke="#334155" stroke-width="1.8"/>
  <path d="M152 90 L144 84 L144 96 Z" fill="#334155"/>
  <text x="126" y="82" font-size="18" fill="#334155" text-anchor="middle">jlink</text>
  <rect x="164" y="71" width="64" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="196" y="97" font-size="18" fill="#b91c1c" text-anchor="middle">e3</text>
  <line x1="228" y1="90" x2="276" y2="90" stroke="#334155" stroke-width="1.8"/>
  <path d="M280 90 L272 84 L272 96 Z" fill="#334155"/>
  <text x="254" y="82" font-size="18" fill="#334155" text-anchor="middle">ilink</text>
  <text x="292" y="96" font-size="18" fill="#6b7280">NULL</text>

  <text x="16" y="159" font-size="20" font-weight="700" fill="#1e3a8a">C</text>
  <rect x="36" y="133" width="64" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="68" y="159" font-size="18" fill="#854d0e" text-anchor="middle">e2</text>
  <line x1="100" y1="152" x2="148" y2="152" stroke="#334155" stroke-width="1.8"/>
  <path d="M152 152 L144 146 L144 158 Z" fill="#334155"/>
  <text x="126" y="144" font-size="18" fill="#334155" text-anchor="middle">jlink</text>
  <rect x="164" y="133" width="64" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="196" y="159" font-size="18" fill="#b91c1c" text-anchor="middle">e3</text>
  <line x1="228" y1="152" x2="276" y2="152" stroke="#334155" stroke-width="1.8"/>
  <path d="M280 152 L272 146 L272 158 Z" fill="#334155"/>
  <text x="254" y="144" font-size="18" fill="#334155" text-anchor="middle">jlink</text>
  <text x="292" y="158" font-size="18" fill="#6b7280">NULL</text>

  <text x="14" y="200" font-size="18" fill="#b91c1c">e3 同时被 B 链和 C 链指着</text>

  <text x="14" y="244" font-size="20" font-weight="700" fill="#1f2937">② 只需改这两个指针字段</text>
  <text x="14" y="270" font-size="18" fill="#6b7280">两端链各绕开 e3 一次</text>

  <rect x="14" y="286" width="332" height="132" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="26" y="316" font-size="19" font-weight="700" fill="#166534">改成 NULL 的两个字段</text>
  <text x="26" y="348" font-size="18" fill="#065f46">e1.jlink：e3 → NULL</text>
  <text x="26" y="376" font-size="18" fill="#065f46">e2.jlink：e3 → NULL</text>
  <text x="26" y="404" font-size="18" fill="#6b7280">四个 firstedge 都不变</text>

  <text x="14" y="458" font-size="20" font-weight="700" fill="#1f2937">③ 删除后：e3 被释放</text>

  <text x="16" y="503" font-size="20" font-weight="700" fill="#1e3a8a">B</text>
  <rect x="36" y="477" width="64" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="68" y="503" font-size="18" fill="#854d0e" text-anchor="middle">e1</text>
  <line x1="100" y1="496" x2="148" y2="496" stroke="#334155" stroke-width="1.8"/>
  <path d="M152 496 L144 490 L144 502 Z" fill="#334155"/>
  <text x="126" y="488" font-size="18" fill="#334155" text-anchor="middle">jlink</text>
  <text x="170" y="502" font-size="18" font-weight="700" fill="#16a34a">NULL</text>

  <text x="16" y="565" font-size="20" font-weight="700" fill="#1e3a8a">C</text>
  <rect x="36" y="539" width="64" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="68" y="565" font-size="18" fill="#854d0e" text-anchor="middle">e2</text>
  <line x1="100" y1="558" x2="148" y2="558" stroke="#334155" stroke-width="1.8"/>
  <path d="M152 558 L144 552 L144 564 Z" fill="#334155"/>
  <text x="126" y="550" font-size="18" fill="#334155" text-anchor="middle">jlink</text>
  <text x="170" y="564" font-size="18" font-weight="700" fill="#16a34a">NULL</text>

  <rect x="250" y="500" width="90" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="250" y1="500" x2="340" y2="556" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="340" y1="500" x2="250" y2="556" stroke="#dc2626" stroke-width="1.5"/>
  <text x="295" y="580" font-size="18" fill="#b91c1c" text-anchor="middle">已删除</text>

  <text x="14" y="616" font-size="18" fill="#1f2937">e3 从两条链上摘除后才释放</text>
  <text x="14" y="642" font-size="18" fill="#1f2937">剩余边结点 e1、e2</text>
  <text x="14" y="668" font-size="18" fill="#1f2937">度：A2、B1、C1、D0（和 4 = 2×2）</text>
  <text x="14" y="702" font-size="18" fill="#b91c1c">次序：先摘两条链，再释放 e3</text>
  <text x="14" y="728" font-size="18" fill="#b91c1c">先释放会留下悬空指针</text>
  <text x="14" y="760" font-size="18" fill="#6b7280">找前驱要沿各自的链走，</text>
  <text x="14" y="784" font-size="18" fill="#6b7280">不是拿到 e3 地址就能 O(1) 删除</text>
</svg>
