<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 690" width="360" height="690" role="img" aria-labelledby="dgTitle dgDesc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title id="dgTitle">用两列下标数出每个顶点的度</title>
  <desc id="dgDesc">上半部把 7 个边结点的 ivex 列（0、1、2、3、4、0、4）与 jvex 列（1、3、0、2、2、3、3）抄出来，指针域不看。下半部逐顶点相加：a 是 ivex 出现 2 次加 jvex 出现 1 次等于 3；b 是 1 加 1 等于 2；c 是 1 加 2 等于 3；d 是 1 加 3 等于 4；e 是 2 加 0 等于 2。b 与 d 两行加框，因为 2024 真题问的就是它们，答案是 2 与 4。所有度数之和 14 等于 2 乘边数 7。</desc>
  <rect x="0" y="0" width="360" height="660" fill="#fffdf7"/>

  <text x="14" y="28" font-size="18" font-weight="700" fill="#1f2937">① 抄出两列下标，只数个数</text>
  <text x="14" y="52" font-size="14" fill="#6b7280">指针域 ilink、jlink 这一步完全不看</text>

  <rect x="14" y="62" width="332" height="262" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <g font-size="14" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="60" y="86">边结点</text>
    <text x="160" y="86">ivex</text>
    <text x="270" y="86">jvex</text>
  </g>
  <line x1="24" y1="94" x2="336" y2="94" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="15" fill="#1e3a8a" text-anchor="middle" font-weight="700">
    <text x="60" y="124">①</text><text x="160" y="124">0</text><text x="270" y="124">1</text>
    <text x="60" y="154">②</text><text x="160" y="154">1</text><text x="270" y="154">3</text>
    <text x="60" y="184">③</text><text x="160" y="184">2</text><text x="270" y="184">0</text>
    <text x="60" y="214">④</text><text x="160" y="214">3</text><text x="270" y="214">2</text>
    <text x="60" y="244">⑤</text><text x="160" y="244">4</text><text x="270" y="244">2</text>
    <text x="60" y="274">⑥</text><text x="160" y="274">0</text><text x="270" y="274">3</text>
    <text x="60" y="304">⑦</text><text x="160" y="304">4</text><text x="270" y="304">3</text>
  </g>

  <text x="14" y="354" font-size="16" font-weight="700" fill="#1f2937">② 逐顶点把两列的次数相加</text>
  <text x="14" y="374" font-size="13" fill="#6b7280">度 = 该顶点在 ivex 列出现的次数 + 在 jvex 列出现的次数</text>

  <rect x="14" y="386" width="332" height="222" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <g font-size="13" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="52" y="408">顶点</text>
    <text x="150" y="408">ivex 列</text>
    <text x="240" y="408">jvex 列</text>
    <text x="312" y="408">度</text>
  </g>
  <line x1="24" y1="416" x2="336" y2="416" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="20" y="460" width="322" height="30" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <rect x="20" y="528" width="322" height="30" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>

  <g font-size="14" fill="#334155" text-anchor="middle">
    <text x="52" y="444">a (0)</text><text x="150" y="444">2</text><text x="240" y="444">1</text><text x="312" y="444" font-weight="700">3</text>
    <text x="52" y="478">b (1)</text><text x="150" y="478">1</text><text x="240" y="478">1</text><text x="312" y="478" font-weight="700">2</text>
    <text x="52" y="512">c (2)</text><text x="150" y="512">1</text><text x="240" y="512">2</text><text x="312" y="512" font-weight="700">3</text>
    <text x="52" y="546">d (3)</text><text x="150" y="546">1</text><text x="240" y="546">3</text><text x="312" y="546" font-weight="700">4</text>
    <text x="52" y="580">e (4)</text><text x="150" y="580">2</text><text x="240" y="580">0</text><text x="312" y="580" font-weight="700">2</text>
  </g>

  <rect x="8" y="620" width="344" height="52" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="20" y="642" font-size="12.5" font-weight="700" fill="#166534">框中两行即真题所问：b = 2、d = 4（选「2, 4」）</text>
  <text x="20" y="662" font-size="12.5" font-weight="700" fill="#166534">复核：度和 3+2+3+4+2 = 14 = 2 × 7（边数）✓</text>
</svg>
