<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 812" width="360" height="812" role="img" aria-labelledby="grTitle grDesc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title id="grTitle">无向图与它的三个共享边结点</title>
  <desc id="grDesc">上半部是无向图：顶点 A、B、C 两两相连，边 e1 连 A 与 B，e2 连 A 与 C，e3 连 B 与 C，顶点 D 孤立；图上的线段两端不画箭头。下半部是邻接多重表的三个边结点，每个结点四个字段：蓝格是端点域 ivex、jvex，存顶点下标；紫格是指针域 ilink、jlink，存下一个边结点的地址。e1 是 ivex=A、jvex=B、ilink=e2、jlink=e3；e2 是 ivex=A、jvex=C、ilink=NULL、jlink=e3；e3 是 ivex=B、jvex=C、ilink=NULL、jlink=NULL。三条边只有三个边结点，A 的链和 B 的链指向同一个 e1。</desc>
  <rect x="0" y="0" width="360" height="812" fill="#fffdf7"/>

  <text x="14" y="30" font-size="20" font-weight="700" fill="#1f2937">① 无向图：边没有方向</text>
  <text x="14" y="56" font-size="18" fill="#6b7280">线段两端都没有箭头</text>

  <line x1="80" y1="110" x2="280" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="110" x2="180" y2="220" stroke="#334155" stroke-width="2"/>
  <line x1="280" y1="110" x2="180" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="180" y="96" font-size="18" font-weight="700" fill="#b45309" text-anchor="middle">e1</text>
  <text x="102" y="190" font-size="18" font-weight="700" fill="#b45309" text-anchor="middle">e2</text>
  <text x="258" y="190" font-size="18" font-weight="700" fill="#b45309" text-anchor="middle">e3</text>

  <g stroke="#2563eb" stroke-width="2" fill="#dbeafe">
    <circle cx="80" cy="110" r="22"/>
    <circle cx="280" cy="110" r="22"/>
    <circle cx="180" cy="220" r="22"/>
    <circle cx="66" cy="300" r="22"/>
  </g>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <text x="80" y="117" fill="#1e3a8a">A</text>
    <text x="280" y="117" fill="#1e3a8a">B</text>
    <text x="180" y="227" fill="#1e3a8a">C</text>
    <text x="66" y="307" fill="#1e3a8a">D</text>
  </g>
  <text x="98" y="306" font-size="18" fill="#6b7280">D 没有任何依附边</text>

  <text x="14" y="352" font-size="20" font-weight="700" fill="#1f2937">② 三条边只建三个边结点</text>
  <text x="14" y="380" font-size="18" fill="#1d4ed8">蓝格＝顶点下标（ivex、jvex）</text>
  <text x="14" y="407" font-size="18" fill="#6d28d9">紫格＝指针域：存下一个边结点</text>

  <rect x="14" y="416" width="332" height="106" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="26" y="442" font-size="19" font-weight="700" fill="#78350f">e1 = 边 A—B（无向）</text>
  <rect x="22" y="450" width="156" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="472" font-size="18" fill="#1e3a8a" text-anchor="middle">ivex = A</text>
  <rect x="182" y="450" width="156" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="472" font-size="18" fill="#1e3a8a" text-anchor="middle">jvex = B</text>
  <rect x="22" y="484" width="156" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="100" y="506" font-size="18" fill="#4c1d95" text-anchor="middle">ilink = e2</text>
  <rect x="182" y="484" width="156" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="260" y="506" font-size="18" fill="#4c1d95" text-anchor="middle">jlink = e3</text>

  <rect x="14" y="530" width="332" height="106" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="26" y="556" font-size="19" font-weight="700" fill="#78350f">e2 = 边 A—C（无向）</text>
  <rect x="22" y="564" width="156" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="586" font-size="18" fill="#1e3a8a" text-anchor="middle">ivex = A</text>
  <rect x="182" y="564" width="156" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="586" font-size="18" fill="#1e3a8a" text-anchor="middle">jvex = C</text>
  <rect x="22" y="598" width="156" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="100" y="620" font-size="18" fill="#4c1d95" text-anchor="middle">ilink = NULL</text>
  <rect x="182" y="598" width="156" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="260" y="620" font-size="18" fill="#4c1d95" text-anchor="middle">jlink = e3</text>

  <rect x="14" y="644" width="332" height="106" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="26" y="670" font-size="19" font-weight="700" fill="#78350f">e3 = 边 B—C（无向）</text>
  <rect x="22" y="678" width="156" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="700" font-size="18" fill="#1e3a8a" text-anchor="middle">ivex = B</text>
  <rect x="182" y="678" width="156" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="700" font-size="18" fill="#1e3a8a" text-anchor="middle">jvex = C</text>
  <rect x="22" y="712" width="156" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="100" y="734" font-size="18" fill="#4c1d95" text-anchor="middle">ilink = NULL</text>
  <rect x="182" y="712" width="156" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="260" y="734" font-size="18" fill="#4c1d95" text-anchor="middle">jlink = NULL</text>

  <text x="14" y="776" font-size="18" fill="#b91c1c">A 的链和 B 的链都指向同一个 e1，</text>
  <text x="14" y="800" font-size="18" fill="#b91c1c">物理上不是各复制一份。</text>
</svg>
