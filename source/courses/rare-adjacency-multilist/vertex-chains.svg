<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" width="360" height="660" role="img" aria-labelledby="vcTitle vcDesc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title id="vcTitle">顶点结点的 firstedge 与四条依附链</title>
  <desc id="vcDesc">上半部是顶点表：A 的 firstedge 是 e1，B 的 firstedge 是 e1，C 的 firstedge 是 e2，D 的 firstedge 是 NULL。下半部是四条依附链，线上的字是这一步走过的字段名。A 链是 e1 经 ilink 到 e2 再经 ilink 到 NULL；B 链是 e1 经 jlink 到 e3 再经 ilink 到 NULL；C 链是 e2 经 jlink 到 e3 再经 jlink 到 NULL；D 没有依附边。e3 同时挂在 B、C 两条链上，链长就是该顶点的度。</desc>
  <rect x="0" y="0" width="360" height="660" fill="#fffdf7"/>

  <text x="14" y="30" font-size="20" font-weight="700" fill="#1f2937">① 顶点结点只有一个字段</text>
  <text x="14" y="56" font-size="18" fill="#6b7280">firstedge＝该顶点的第一条依附边</text>

  <rect x="14" y="72" width="164" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="96" y="98" font-size="18" fill="#1e3a8a" text-anchor="middle">A  firstedge=e1</text>
  <rect x="182" y="72" width="164" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="264" y="98" font-size="18" fill="#1e3a8a" text-anchor="middle">B  firstedge=e1</text>
  <rect x="14" y="118" width="164" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="96" y="144" font-size="18" fill="#1e3a8a" text-anchor="middle">C  firstedge=e2</text>
  <rect x="182" y="118" width="164" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="264" y="144" font-size="18" fill="#1e3a8a" text-anchor="middle">D  firstedge=NULL</text>
  <text x="14" y="186" font-size="18" fill="#6b7280">D 的 firstedge 为 NULL（无依附边）</text>

  <text x="14" y="226" font-size="20" font-weight="700" fill="#1f2937">② 依附链：跟着指针走到 NULL</text>
  <text x="14" y="252" font-size="18" fill="#6b7280">细箭头＝指针，线上的字＝字段名</text>
  <text x="14" y="278" font-size="18" fill="#1f2937">规则：v 等于 ivex 就走 ilink</text>
  <text x="68" y="302" font-size="18" fill="#1f2937">v 等于 jvex 就走 jlink</text>

  <text x="16" y="347" font-size="20" font-weight="700" fill="#1e3a8a">A</text>
  <rect x="36" y="321" width="64" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="68" y="347" font-size="18" fill="#854d0e" text-anchor="middle">e1</text>
  <line x1="100" y1="340" x2="148" y2="340" stroke="#334155" stroke-width="1.8"/>
  <path d="M152 340 L144 334 L144 346 Z" fill="#334155"/>
  <text x="126" y="332" font-size="18" fill="#334155" text-anchor="middle">ilink</text>
  <rect x="164" y="321" width="64" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="196" y="347" font-size="18" fill="#854d0e" text-anchor="middle">e2</text>
  <line x1="228" y1="340" x2="276" y2="340" stroke="#334155" stroke-width="1.8"/>
  <path d="M280 340 L272 334 L272 346 Z" fill="#334155"/>
  <text x="254" y="332" font-size="18" fill="#334155" text-anchor="middle">ilink</text>
  <text x="292" y="346" font-size="18" fill="#6b7280">NULL</text>

  <text x="16" y="409" font-size="20" font-weight="700" fill="#1e3a8a">B</text>
  <rect x="36" y="383" width="64" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="68" y="409" font-size="18" fill="#854d0e" text-anchor="middle">e1</text>
  <line x1="100" y1="402" x2="148" y2="402" stroke="#334155" stroke-width="1.8"/>
  <path d="M152 402 L144 396 L144 408 Z" fill="#334155"/>
  <text x="126" y="394" font-size="18" fill="#334155" text-anchor="middle">jlink</text>
  <rect x="164" y="383" width="64" height="38" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="196" y="409" font-size="18" fill="#854d0e" text-anchor="middle">e3</text>
  <line x1="228" y1="402" x2="276" y2="402" stroke="#334155" stroke-width="1.8"/>
  <path d="M280 402 L272 396 L272 408 Z" fill="#334155"/>
  <text x="254" y="394" font-size="18" fill="#334155" text-anchor="middle">ilink</text>
  <text x="292" y="408" font-size="18" fill="#6b7280">NULL</text>

  <text x="16" y="471" font-size="20" font-weight="700" fill="#1e3a8a">C</text>
  <rect x="36" y="445" width="64" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="68" y="471" font-size="18" fill="#854d0e" text-anchor="middle">e2</text>
  <line x1="100" y1="464" x2="148" y2="464" stroke="#334155" stroke-width="1.8"/>
  <path d="M152 464 L144 458 L144 470 Z" fill="#334155"/>
  <text x="126" y="456" font-size="18" fill="#334155" text-anchor="middle">jlink</text>
  <rect x="164" y="445" width="64" height="38" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="196" y="471" font-size="18" fill="#854d0e" text-anchor="middle">e3</text>
  <line x1="228" y1="464" x2="276" y2="464" stroke="#334155" stroke-width="1.8"/>
  <path d="M280 464 L272 458 L272 470 Z" fill="#334155"/>
  <text x="254" y="456" font-size="18" fill="#334155" text-anchor="middle">jlink</text>
  <text x="292" y="470" font-size="18" fill="#6b7280">NULL</text>

  <text x="16" y="533" font-size="20" font-weight="700" fill="#1e3a8a">D</text>
  <text x="60" y="533" font-size="18" fill="#6b7280">firstedge = NULL：没有依附边</text>

  <text x="14" y="580" font-size="18" fill="#b91c1c">e3 同时挂在 B、C 两条链上</text>
  <text x="14" y="604" font-size="18" fill="#1f2937">链长就是度：A2、B2、C2、D0</text>
  <text x="14" y="628" font-size="18" fill="#1f2937">追链不是沿图的边走：当前顶点不变</text>
</svg>
