<svg xmlns="http://www.w3.org/2000/svg" width="360" height="878" viewBox="0 0 360 878" role="img" aria-labelledby="title desc">
<title id="title">三个四位减法的完整标志和比较结果</title>
<desc id="desc">三个减法结果、CF OF SF ZF的值以及各自的有符号和无符号比较。前两例OF为1说明直接看SF会误判。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8 Z" fill="#19745d"/>
</marker>
</defs>
<rect width="360" height="878" rx="16" fill="#fffdf7"/>
<g font-family="Microsoft YaHei, Segoe UI, sans-serif">
<text x="20" y="35" font-size="24" font-weight="700" fill="#173c36">同一串位，两种比较</text>
<rect x="16" y="60" width="328" height="231" rx="12" fill="#eff8f5" stroke="#a9cfc3"/>
<text x="29" y="94" font-size="21" font-weight="700" fill="#173c36">① 0111 − 1111 = 1000</text>
<text x="29" y="135" font-size="20" font-weight="400" fill="#173c36">CF=1  OF=1  SF=1  ZF=0</text>
<text x="29" y="179" font-size="22" font-weight="400" fill="#155e75">无符号：7 &lt; 15</text>
<text x="29" y="218" font-size="22" font-weight="400" fill="#965914">有符号：7 &gt; −1</text>
<text x="29" y="260" font-size="20" font-weight="400" fill="#173c36">SF ⊕ OF = 0</text>
<rect x="16" y="313" width="328" height="231" rx="12" fill="#fff4e5" stroke="#a9cfc3"/>
<text x="29" y="347" font-size="21" font-weight="700" fill="#173c36">② 1000 − 0001 = 0111</text>
<text x="29" y="388" font-size="20" font-weight="400" fill="#173c36">CF=0  OF=1  SF=0  ZF=0</text>
<text x="29" y="432" font-size="22" font-weight="400" fill="#155e75">无符号：8 &gt; 1</text>
<text x="29" y="471" font-size="22" font-weight="400" fill="#965914">有符号：−8 &lt; 1</text>
<text x="29" y="513" font-size="20" font-weight="400" fill="#173c36">SF ⊕ OF = 1</text>
<rect x="16" y="566" width="328" height="231" rx="12" fill="#eff8f5" stroke="#a9cfc3"/>
<text x="29" y="600" font-size="21" font-weight="700" fill="#173c36">③ 0101 − 0101 = 0000</text>
<text x="29" y="641" font-size="20" font-weight="400" fill="#173c36">CF=0  OF=0  SF=0  ZF=1</text>
<text x="29" y="685" font-size="22" font-weight="400" fill="#155e75">无符号：5 = 5</text>
<text x="29" y="724" font-size="22" font-weight="400" fill="#965914">有符号：5 = 5</text>
<text x="29" y="766" font-size="20" font-weight="400" fill="#173c36">ZF = 1，严格大于不成立</text>
<text x="22" y="853" font-size="18" font-weight="400" fill="#173c36">CF 看无符号；SF ⊕ OF 看有符号。</text>
</g>
</svg>
