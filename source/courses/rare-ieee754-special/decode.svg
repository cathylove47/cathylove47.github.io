<svg width="360" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-labelledby="dcTitle dcDesc">
<title id="dcTitle">九个单精度十六进制位模式及其分类与数值</title>
<desc id="dcDesc">逐个给出 00000000 到 7FC00000 九个位模式的分类与精确值：有符号零、非规格数（最小 2^-149、最大 (1−2^-23)·2^-126）、规格数（最小 2^-126、最大 (2−2^-23)·2^127）、正负无穷与非数。</desc>
<rect x="0" y="0" width="360" height="600" fill="#f8fafc"/>
<text x="180" y="34" font-size="22" font-family="system-ui, sans-serif" font-weight="700" fill="#0f172a" text-anchor="middle">九个位模式的分类与精确值</text>
<text x="180" y="60" font-size="19" font-family="system-ui, sans-serif" fill="#475569" text-anchor="middle">本站绘制：按 s / E / F 逐项判定</text>

<rect x="8" y="76" width="344" height="52" rx="6" fill="#fef3c7"/>
<text x="18" y="97" font-size="20" font-family="ui-monospace, monospace" fill="#0f172a">0x00000000</text>
<text x="182" y="97" font-size="18" font-family="system-ui, sans-serif" fill="#92400e">E=0, F=0</text>
<text x="18" y="120" font-size="19" font-family="system-ui, sans-serif" fill="#0f172a">有符号零 = +0（正零）</text>

<rect x="8" y="132" width="344" height="52" rx="6" fill="#fef3c7"/>
<text x="18" y="153" font-size="20" font-family="ui-monospace, monospace" fill="#0f172a">0x80000000</text>
<text x="182" y="153" font-size="18" font-family="system-ui, sans-serif" fill="#92400e">E=0, F=0</text>
<text x="18" y="176" font-size="19" font-family="system-ui, sans-serif" fill="#0f172a">有符号零 = −0（负零）</text>

<rect x="8" y="188" width="344" height="52" rx="6" fill="#eef2ff"/>
<text x="18" y="209" font-size="20" font-family="ui-monospace, monospace" fill="#0f172a">0x00000001</text>
<text x="182" y="209" font-size="18" font-family="system-ui, sans-serif" fill="#1e3a8a">E=0, F≠0</text>
<text x="18" y="232" font-size="19" font-family="system-ui, sans-serif" fill="#0f172a">最小正非规格数 = 2^-149</text>

<rect x="8" y="244" width="344" height="52" rx="6" fill="#eef2ff"/>
<text x="18" y="265" font-size="20" font-family="ui-monospace, monospace" fill="#0f172a">0x007FFFFF</text>
<text x="182" y="265" font-size="18" font-family="system-ui, sans-serif" fill="#1e3a8a">E=0, F≠0</text>
<text x="18" y="288" font-size="19" font-family="system-ui, sans-serif" fill="#0f172a">最大非规格数 = (1−2^-23)·2^-126</text>

<rect x="8" y="300" width="344" height="52" rx="6" fill="#dcfce7"/>
<text x="18" y="321" font-size="20" font-family="ui-monospace, monospace" fill="#0f172a">0x00800000</text>
<text x="182" y="321" font-size="18" font-family="system-ui, sans-serif" fill="#166534">E=1</text>
<text x="18" y="344" font-size="19" font-family="system-ui, sans-serif" fill="#0f172a">最小正规格数 = 2^-126</text>

<rect x="8" y="356" width="344" height="52" rx="6" fill="#dcfce7"/>
<text x="18" y="377" font-size="20" font-family="ui-monospace, monospace" fill="#0f172a">0x7F7FFFFF</text>
<text x="182" y="377" font-size="18" font-family="system-ui, sans-serif" fill="#166534">E=254</text>
<text x="18" y="400" font-size="19" font-family="system-ui, sans-serif" fill="#0f172a">最大有限数 = (2−2^-23)·2^127</text>

<rect x="8" y="412" width="344" height="52" rx="6" fill="#fee2e2"/>
<text x="18" y="433" font-size="20" font-family="ui-monospace, monospace" fill="#0f172a">0x7F800000</text>
<text x="182" y="433" font-size="18" font-family="system-ui, sans-serif" fill="#991b1b">E=255, F=0</text>
<text x="18" y="456" font-size="19" font-family="system-ui, sans-serif" fill="#0f172a">= +∞（正无穷）</text>

<rect x="8" y="468" width="344" height="52" rx="6" fill="#fee2e2"/>
<text x="18" y="489" font-size="20" font-family="ui-monospace, monospace" fill="#0f172a">0xFF800000</text>
<text x="182" y="489" font-size="18" font-family="system-ui, sans-serif" fill="#991b1b">E=255, F=0</text>
<text x="18" y="512" font-size="19" font-family="system-ui, sans-serif" fill="#0f172a">= −∞（负无穷）</text>

<rect x="8" y="524" width="344" height="52" rx="6" fill="#fee2e2"/>
<text x="18" y="545" font-size="20" font-family="ui-monospace, monospace" fill="#0f172a">0x7FC00000</text>
<text x="182" y="545" font-size="18" font-family="system-ui, sans-serif" fill="#991b1b">E=255, F≠0</text>
<text x="18" y="568" font-size="19" font-family="system-ui, sans-serif" fill="#0f172a">= NaN（非数，可有很多模式）</text>
</svg>
