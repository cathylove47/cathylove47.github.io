<svg width="360" height="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="ttl dsc" font-family="'Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif">
<rect x="0" y="0" width="360" height="640" fill="#fffdf7"/>
<title id="ttl">十字链表的出边链与入边链</title>
<desc id="dsc">firstout沿tlink给出同弧尾的弧；firstin沿hlink给出同弧头的弧；弧e1同时出现在A的出边链和B的入边链。</desc>
<defs>
<marker id="mk_graph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
</marker>
<marker id="mk_out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
</marker>
<marker id="mk_in" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
</marker>
</defs>
<rect x="12" y="8" width="336" height="304" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="24" y="36" font-size="18" text-anchor="start" fill="#0f172a" font-weight="bold">出边链：顶点 firstout → 弧 tlink</text>
<text x="24" y="60" font-size="18" text-anchor="start" fill="#2563eb" font-weight="bold">蓝箭头：firstout → tlink（同弧尾）</text>
<rect x="20" y="100" width="42" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="41.0" y="127" font-size="22" text-anchor="#7c2d12" fill="bold">A</text>
<line x1="62" y1="120" x2="95.0" y2="120" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mk_out)"/>
<rect x="95.0" y="100" width="50" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="120.0" y="117" font-size="20" text-anchor="#14532d" fill="bold">e1</text>
<text x="120.0" y="135" font-size="18" text-anchor="#14532d" fill="#0f172a">A→B</text>
<line x1="145.0" y1="120" x2="199.0" y2="120" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mk_out)"/>
<text x="172.0" y="112" font-size="18" text-anchor="middle" fill="#2563eb" font-weight="bold">tlink</text>
<rect x="199.0" y="100" width="50" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="224.0" y="117" font-size="20" text-anchor="#14532d" fill="bold">e2</text>
<text x="224.0" y="135" font-size="18" text-anchor="#14532d" fill="#0f172a">A→C</text>
<line x1="249.0" y1="120" x2="282.0" y2="120" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mk_out)"/>
<text x="290" y="126" font-size="18" text-anchor="start" fill="#64748b" font-weight="bold">NULL</text>
<rect x="20" y="160" width="42" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="41.0" y="187" font-size="22" text-anchor="#7c2d12" fill="bold">B</text>
<line x1="62" y1="180" x2="282" y2="180" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mk_out)"/>
<text x="290" y="186" font-size="18" text-anchor="start" fill="#64748b" font-weight="bold">NULL</text>
<rect x="20" y="220" width="42" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="41.0" y="247" font-size="22" text-anchor="#7c2d12" fill="bold">C</text>
<line x1="62" y1="240" x2="147.0" y2="240" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mk_out)"/>
<rect x="147.0" y="220" width="50" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="172.0" y="237" font-size="20" text-anchor="#14532d" fill="bold">e3</text>
<text x="172.0" y="255" font-size="18" text-anchor="#14532d" fill="#0f172a">C→B</text>
<line x1="197.0" y1="240" x2="282.0" y2="240" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mk_out)"/>
<text x="290" y="246" font-size="18" text-anchor="start" fill="#64748b" font-weight="bold">NULL</text>
<rect x="20" y="280" width="42" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="41.0" y="307" font-size="22" text-anchor="#7c2d12" fill="bold">D</text>
<line x1="62" y1="300" x2="282" y2="300" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mk_out)"/>
<text x="290" y="306" font-size="18" text-anchor="start" fill="#64748b" font-weight="bold">NULL</text>
<rect x="12" y="324" width="336" height="304" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="24" y="352" font-size="18" text-anchor="start" fill="#0f172a" font-weight="bold">入边链：顶点 firstin → 弧 hlink</text>
<text x="24" y="376" font-size="18" text-anchor="start" fill="#dc2626" font-weight="bold">红箭头：firstin → hlink（同弧头）</text>
<rect x="20" y="416" width="42" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="41.0" y="443" font-size="22" text-anchor="#7c2d12" fill="bold">A</text>
<line x1="62" y1="436" x2="282" y2="436" stroke="#dc2626" stroke-width="2.2" marker-end="url(#mk_in)"/>
<text x="290" y="442" font-size="18" text-anchor="start" fill="#64748b" font-weight="bold">NULL</text>
<rect x="20" y="476" width="42" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="41.0" y="503" font-size="22" text-anchor="#7c2d12" fill="bold">B</text>
<line x1="62" y1="496" x2="95.0" y2="496" stroke="#dc2626" stroke-width="2.2" marker-end="url(#mk_in)"/>
<rect x="95.0" y="476" width="50" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="120.0" y="493" font-size="20" text-anchor="#14532d" fill="bold">e1</text>
<text x="120.0" y="511" font-size="18" text-anchor="#14532d" fill="#0f172a">A→B</text>
<line x1="145.0" y1="496" x2="199.0" y2="496" stroke="#dc2626" stroke-width="2.2" marker-end="url(#mk_in)"/>
<text x="172.0" y="488" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold">hlink</text>
<rect x="199.0" y="476" width="50" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="224.0" y="493" font-size="20" text-anchor="#14532d" fill="bold">e3</text>
<text x="224.0" y="511" font-size="18" text-anchor="#14532d" fill="#0f172a">C→B</text>
<line x1="249.0" y1="496" x2="282.0" y2="496" stroke="#dc2626" stroke-width="2.2" marker-end="url(#mk_in)"/>
<text x="290" y="502" font-size="18" text-anchor="start" fill="#64748b" font-weight="bold">NULL</text>
<rect x="20" y="536" width="42" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="41.0" y="563" font-size="22" text-anchor="#7c2d12" fill="bold">C</text>
<line x1="62" y1="556" x2="147.0" y2="556" stroke="#dc2626" stroke-width="2.2" marker-end="url(#mk_in)"/>
<rect x="147.0" y="536" width="50" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="172.0" y="553" font-size="20" text-anchor="#14532d" fill="bold">e2</text>
<text x="172.0" y="571" font-size="18" text-anchor="#14532d" fill="#0f172a">A→C</text>
<line x1="197.0" y1="556" x2="282.0" y2="556" stroke="#dc2626" stroke-width="2.2" marker-end="url(#mk_in)"/>
<text x="290" y="562" font-size="18" text-anchor="start" fill="#64748b" font-weight="bold">NULL</text>
<rect x="20" y="596" width="42" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="41.0" y="623" font-size="22" text-anchor="#7c2d12" fill="bold">D</text>
<line x1="62" y1="616" x2="282" y2="616" stroke="#dc2626" stroke-width="2.2" marker-end="url(#mk_in)"/>
<text x="290" y="622" font-size="18" text-anchor="start" fill="#64748b" font-weight="bold">NULL</text>
</svg>
