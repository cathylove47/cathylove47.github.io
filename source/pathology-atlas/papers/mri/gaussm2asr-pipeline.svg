<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
<title id="title">GaussM2ASR pipeline reconstructed from Figure 3</title><desc id="desc">Low resolution target and high resolution reference pass through CSMF, SPMF, AG-DDCA, Gaussian Transformer and anatomy-guided Gaussian parameterization before two-dimensional Gaussian rasterization.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#596273"/></marker><style>.b{fill:#fff;stroke:#596273;stroke-width:2;rx:14}.m{fill:#edf4ff;stroke:#4b74b8}.g{fill:#f5edff;stroke:#8055a5}.o{fill:#fff3e6;stroke:#bb6b23}.t{font:600 18px system-ui;fill:#202633;text-anchor:middle}.s{font:14px system-ui;fill:#596273;text-anchor:middle}.l{fill:none;stroke:#596273;stroke-width:2.5;marker-end:url(#a)}</style></defs>
<rect width="1500" height="520" fill="#fbfcfe"/>
<text x="750" y="38" class="t" style="font-size:25px">GaussM²ASR pipeline — reconstructed from paper Figure 3</text>
<g><rect x="35" y="105" width="165" height="72" class="b m"/><text x="117" y="135" class="t">LR target MRI</text><text x="117" y="158" class="s">target contrast</text><rect x="35" y="250" width="165" height="72" class="b m"/><text x="117" y="280" class="t">HR reference</text><text x="117" y="303" class="s">anatomy guidance</text>
<rect x="250" y="145" width="165" height="92" class="b m"/><text x="332" y="180" class="t">CSMF encoder</text><text x="332" y="205" class="s">multi-scale features</text>
<rect x="465" y="145" width="170" height="92" class="b m"/><text x="550" y="178" class="t">SPMF</text><text x="550" y="202" class="s">statistics modulation</text><text x="550" y="222" class="s">+ pixel gate</text>
<rect x="685" y="145" width="190" height="92" class="b g"/><text x="780" y="178" class="t">AG-DDCA</text><text x="780" y="202" class="s">spatial + frequency</text><text x="780" y="222" class="s">cross-attention</text>
<rect x="925" y="145" width="190" height="92" class="b g"/><text x="1020" y="180" class="t">Gaussian</text><text x="1020" y="205" class="t">Transformer</text>
<rect x="1165" y="120" width="190" height="122" class="b o"/><text x="1260" y="153" class="t">AGGP</text><text x="1260" y="178" class="s">Sobel-guided Top-T</text><text x="1260" y="198" class="s">sparse attention</text><text x="1260" y="220" class="s">center μ = μᵢ + μₒ</text>
<rect x="1165" y="310" width="190" height="92" class="b o"/><text x="1260" y="343" class="t">Parameter heads</text><text x="1260" y="368" class="s">Σ · opacity α · intensity r</text>
<rect x="1380" y="190" width="100" height="130" class="b o"/><text x="1430" y="238" class="t">2D</text><text x="1430" y="263" class="t">Gaussian</text><text x="1430" y="288" class="t">render</text>
<rect x="680" y="355" width="200" height="65" class="b"/><text x="780" y="382" class="t">Scale embedding</text><text x="780" y="404" class="s">+ Gaussian prompts</text></g>
<path d="M200 141H250" class="l"/><path d="M200 286C220 286 220 210 250 210" class="l"/><path d="M415 191H465" class="l"/><path d="M635 191H685" class="l"/><path d="M875 191H925" class="l"/><path d="M1115 181H1165" class="l"/><path d="M1115 210C1140 210 1140 356 1165 356" class="l"/><path d="M1355 181C1370 181 1370 230 1380 230" class="l"/><path d="M1355 356C1370 356 1370 285 1380 285" class="l"/><path d="M780 355V238" class="l"/><path d="M200 286C700 475 1020 460 1165 215" class="l"/>
